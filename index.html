<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>HarmonyCast · Full Music Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        body {
            background: radial-gradient(circle at 10% 20%, #0c0c12, #050508);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .app-container {
            max-width: 1400px;
            width: 100%;
            background: rgba(12, 12, 20, 0.7);
            backdrop-filter: blur(16px);
            border-radius: 48px;
            border: 1px solid rgba(255,255,255,0.08);
            overflow: hidden;
            transition: all 0.2s;
        }
        /* Auth Panel */
        .auth-panel {
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 70vh;
        }
        .auth-card {
            background: rgba(25,25,35,0.95);
            border-radius: 48px;
            padding: 40px;
            width: 100%;
            max-width: 460px;
            text-align: center;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .auth-card h2 {
            margin-bottom: 24px;
            font-size: 28px;
            background: linear-gradient(135deg, #fff, #aaa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 40px;
            font-size: 16px;
            color: white;
            outline: none;
        }
        .auth-btn {
            width: 100%;
            padding: 14px;
            background: #1DB954;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 16px;
            color: black;
            cursor: pointer;
            margin-top: 12px;
        }
        .toggle-auth {
            margin-top: 20px;
            color: #aaa;
            cursor: pointer;
        }
        .toggle-auth span {
            color: #1DB954;
        }
        .error-msg {
            color: #f55;
            font-size: 13px;
            margin-top: 8px;
        }
        /* Main App */
        .main-app {
            display: none;
        }
        .main-app.active {
            display: block;
        }
        .app-header {
            padding: 20px 32px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            background: #1DB954;
            width: 44px;
            height: 44px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: black;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .user-role {
            background: rgba(255,255,255,0.1);
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 12px;
        }
        .logout-btn {
            background: none;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
        }
        .player-grid {
            display: flex;
            flex-wrap: wrap;
            padding: 24px;
            gap: 24px;
        }
        .playlist-panel {
            flex: 2;
            min-width: 280px;
            background: rgba(0,0,0,0.25);
            border-radius: 32px;
            padding: 20px;
            height: 55vh;
            overflow-y: auto;
        }
        .visualizer-panel {
            flex: 1.5;
            background: rgba(0,0,0,0.25);
            border-radius: 32px;
            padding: 20px;
        }
        .admin-section {
            background: rgba(29,185,84,0.1);
            border-radius: 28px;
            padding: 16px;
            margin-bottom: 20px;
            display: none;
        }
        .admin-section.admin-visible {
            display: block;
        }
        .input-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 12px;
        }
        .input-field {
            flex: 1;
        }
        .input-field input {
            width: 100%;
            background: #101014;
            border: 1px solid #2a2a32;
            border-radius: 40px;
            padding: 12px 16px;
            color: white;
        }
        .btn-primary {
            background: #1DB954;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
        }
        .track-item {
            background: rgba(255,255,255,0.03);
            margin-bottom: 8px;
            border-radius: 20px;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.1s;
        }
        .track-item.active-track {
            background: rgba(29,185,84,0.2);
            border-left: 4px solid #1DB954;
        }
        .track-info {
            display: flex;
            gap: 14px;
            align-items: center;
            flex: 1;
        }
        .track-actions {
            display: none;
            gap: 8px;
        }
        .admin-visible .track-actions {
            display: flex;
        }
        .track-actions button {
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 16px;
        }
        .vinyl-disc {
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, #2a2a35, #111);
            border-radius: 50%;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        .vinyl-spin {
            animation: spin 5s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .progress-bar {
            background: #2e2e3a;
            height: 6px;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px 0;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: #1DB954;
            border-radius: 10px;
        }
        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }
        .ctrl-btn {
            background: #1f1f2c;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 20px;
        }
        .ctrl-btn-big {
            background: #1DB954;
            width: 60px;
            height: 60px;
            font-size: 28px;
            color: black;
        }
        @media (max-width: 820px) {
            .player-grid { flex-direction: column; }
        }
        /* Light theme */
        body.light-theme {
            background: #e9ecef;
        }
        body.light-theme .app-container {
            background: rgba(245,245,255,0.9);
            border-color: #ccc;
        }
        body.light-theme .track-item,
        body.light-theme .admin-section {
            background: rgba(0,0,0,0.05);
        }
        body.light-theme .track-title,
        body.light-theme h3 {
            color: #000;
        }
        body.light-theme .ctrl-btn {
            background: #ddd;
            color: #111;
        }
        body.light-theme .input-field input {
            background: #fff;
            color: #000;
        }
    </style>
</head>
<body>
<div class="app-container" id="appContainer">
    <!-- AUTH PANEL -->
    <div id="authPanel" class="auth-panel">
        <div class="auth-card">
            <div class="logo-icon" style="margin:0 auto 20px; width:60px; height:60px; font-size:32px;"><i class="fas fa-headphones"></i></div>
            <h2>HarmonyCast</h2>
            <div id="loginForm">
                <div class="input-group"><input type="email" id="loginEmail" placeholder="Email"></div>
                <div class="input-group"><input type="password" id="loginPassword" placeholder="Password"></div>
                <button class="auth-btn" id="doLoginBtn">Login</button>
                <div class="toggle-auth" id="showRegisterBtn">Belum punya akun? <span>Daftar</span></div>
                <div id="loginError" class="error-msg"></div>
            </div>
            <div id="registerForm" style="display:none;">
                <div class="input-group"><input type="email" id="regEmail" placeholder="Email"></div>
                <div class="input-group"><input type="password" id="regPassword" placeholder="Password"></div>
                <div class="input-group"><input type="password" id="regConfirm" placeholder="Konfirmasi Password"></div>
                <button class="auth-btn" id="doRegisterBtn">Daftar</button>
                <div class="toggle-auth" id="showLoginBtn"><span>← Kembali ke Login</span></div>
                <div id="regError" class="error-msg"></div>
            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="mainApp" class="main-app">
        <div class="app-header">
            <div class="logo-area">
                <div class="logo-icon"><i class="fas fa-music"></i></div>
                <h1>HarmonyCast</h1>
            </div>
            <div class="user-info">
                <span class="user-role" id="userRoleLabel">User</span>
                <span id="userEmailLabel" style="font-size:14px;"></span>
                <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
        <div class="player-grid">
            <div class="playlist-panel">
                <div id="adminSection" class="admin-section">
                    <h4><i class="fas fa-crown"></i> Admin Panel - Kelola Lagu</h4>
                    <div class="input-row">
                        <div class="input-field"><input type="text" id="adminUrl" placeholder="Link MP3 (Catbox) .mp3"></div>
                        <div class="input-field"><input type="text" id="adminTitle" placeholder="Judul Lagu"></div>
                        <div class="input-field"><input type="text" id="adminArtist" placeholder="Artis"></div>
                        <button class="btn-primary" id="adminAddSongBtn">Tambah</button>
                    </div>
                    <div id="adminError" style="color:#f55; font-size:12px; margin-top:6px;"></div>
                </div>
                <div id="playlistContainer"></div>
                <div id="emptyMsg" style="text-align:center; padding:40px; color:#aaa;">Belum ada lagu. Admin dapat menambahkan.</div>
            </div>
            <div class="visualizer-panel">
                <div style="text-align:center;">
                    <div class="vinyl-disc" id="vinylDisc"><i class="fas fa-record-vinyl" style="font-size:80px; color:#1DB954;"></i></div>
                    <h3 id="nowPlayingTitle">Pilih lagu</h3>
                    <p id="nowPlayingArtist">-</p>
                </div>
                <div class="progress-section">
                    <div class="time-info"><span id="currentTime">0:00</span><span id="durationTime">0:00</span></div>
                    <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
                </div>
                <div class="controls">
                    <button class="ctrl-btn" id="shuffleBtn"><i class="fas fa-random"></i></button>
                    <button class="ctrl-btn" id="prevBtn"><i class="fas fa-step-backward"></i></button>
                    <button class="ctrl-btn ctrl-btn-big" id="playPauseBtn"><i class="fas fa-play"></i></button>
                    <button class="ctrl-btn" id="nextBtn"><i class="fas fa-step-forward"></i></button>
                    <button class="ctrl-btn" id="repeatBtn"><i class="fas fa-redo-alt"></i></button>
                </div>
                <div style="display:flex; justify-content:center; gap:16px; margin-top:12px;">
                    <select id="speedControl" style="background:#1a1a24; border-radius:40px; padding:6px 12px; color:white;">
                        <option value="1">1.0x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2.0x</option>
                    </select>
                    <button id="themeToggle" style="background:none; border:1px solid #2e2e3a; border-radius:40px; padding:6px 12px; color:white;"><i class="fas fa-moon"></i> Dark/Light</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ---------- DATA & STORAGE ----------
    let users = JSON.parse(localStorage.getItem('harmony_users')) || [];
    let masterPlaylist = JSON.parse(localStorage.getItem('harmony_master_playlist')) || [];
    let currentUser = null;
    let currentSongIndex = 0;
    let isPlaying = false;
    let shuffleMode = false;
    let repeatMode = false;   // repeat one song
    let audio = new Audio();
    let currentQueue = [];

    // DOM elements
    const authPanel = document.getElementById('authPanel');
    const mainApp = document.getElementById('mainApp');
    const playlistContainer = document.getElementById('playlistContainer');
    const emptyMsg = document.getElementById('emptyMsg');
    const nowPlayingTitle = document.getElementById('nowPlayingTitle');
    const nowPlayingArtist = document.getElementById('nowPlayingArtist');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressFill = document.getElementById('progressFill');
    const progressBar = document.getElementById('progressBar');
    const currentTimeSpan = document.getElementById('currentTime');
    const durationSpan = document.getElementById('durationTime');
    const vinylDisc = document.getElementById('vinylDisc');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const repeatBtn = document.getElementById('repeatBtn');
    const speedControl = document.getElementById('speedControl');
    const themeToggle = document.getElementById('themeToggle');
    const adminSection = document.getElementById('adminSection');
    const userRoleLabel = document.getElementById('userRoleLabel');
    const userEmailLabel = document.getElementById('userEmailLabel');
    const logoutBtn = document.getElementById('logoutBtn');
    const adminAddSongBtn = document.getElementById('adminAddSongBtn');
    const adminUrl = document.getElementById('adminUrl');
    const adminTitle = document.getElementById('adminTitle');
    const adminArtist = document.getElementById('adminArtist');
    const adminError = document.getElementById('adminError');

    // Auth elements
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const loginEmail = document.getElementById('loginEmail');
    const loginPassword = document.getElementById('loginPassword');
    const regEmail = document.getElementById('regEmail');
    const regPassword = document.getElementById('regPassword');
    const regConfirm = document.getElementById('regConfirm');
    const loginError = document.getElementById('loginError');
    const regError = document.getElementById('regError');

    // Helper functions
    function saveUsers() { localStorage.setItem('harmony_users', JSON.stringify(users)); }
    function saveMasterPlaylist() { localStorage.setItem('harmony_master_playlist', JSON.stringify(masterPlaylist)); }

    // Build queue berdasarkan shuffle
    function buildQueue() {
        if (shuffleMode) {
            let indices = Array.from(Array(masterPlaylist.length).keys());
            for (let i = indices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [indices[i], indices[j]] = [indices[j], indices[i]];
            }
            currentQueue = indices.map(i => masterPlaylist[i]);
        } else {
            currentQueue = [...masterPlaylist];
        }
        // validasi currentSongIndex
        if (currentQueue.length && (!masterPlaylist[currentSongIndex] || !currentQueue.find(s => s.id === masterPlaylist[currentSongIndex]?.id))) {
            currentSongIndex = 0;
        }
    }

    // Load lagu berdasarkan index di masterPlaylist
    function loadSong(index) {
        if (!masterPlaylist.length || index < 0 || index >= masterPlaylist.length) return false;
        const song = masterPlaylist[index];
        audio.src = song.url;
        audio.load();
        nowPlayingTitle.innerText = song.title;
        nowPlayingArtist.innerText = song.artist;
        if (isPlaying) {
            audio.play().catch(e => console.warn("Auto-play error:", e));
            vinylDisc.classList.add('vinyl-spin');
        } else {
            vinylDisc.classList.remove('vinyl-spin');
        }
        updatePlayButton();
        renderPlaylist(); // highlight active
        return true;
    }

    function playCurrent() {
        if (!masterPlaylist.length) return;
        if (currentSongIndex === -1) currentSongIndex = 0;
        const playPromise = audio.play();
        if (playPromise !== undefined) {
            playPromise.then(() => {
                isPlaying = true;
                vinylDisc.classList.add('vinyl-spin');
                updatePlayButton();
            }).catch(err => {
                console.log("Playback prevented:", err);
                isPlaying = false;
                updatePlayButton();
            });
        }
    }

    function pauseCurrent() {
        audio.pause();
        isPlaying = false;
        vinylDisc.classList.remove('vinyl-spin');
        updatePlayButton();
    }

    // Next track: full playback sampai selesai
    function nextTrack() {
        if (!masterPlaylist.length) return;
        buildQueue();
        let currentIdxInQueue = currentQueue.findIndex(s => s.id === masterPlaylist[currentSongIndex]?.id);
        if (currentIdxInQueue === -1) currentIdxInQueue = 0;
        let nextIdx = (currentIdxInQueue + 1) % currentQueue.length;
        if (repeatMode) {
            // repeat one: putar ulang lagu yang sama
            loadSong(currentSongIndex);
            playCurrent();
            return;
        }
        const nextSong = currentQueue[nextIdx];
        if (nextSong) {
            const newIndex = masterPlaylist.findIndex(s => s.id === nextSong.id);
            if (newIndex !== -1) {
                currentSongIndex = newIndex;
                loadSong(currentSongIndex);
                playCurrent();
            } else {
                // fallback
                if (masterPlaylist.length) {
                    currentSongIndex = (currentSongIndex + 1) % masterPlaylist.length;
                    loadSong(currentSongIndex);
                    playCurrent();
                }
            }
        } else if (!repeatMode) {
            // end of playlist, stop
            pauseCurrent();
            currentSongIndex = -1;
        }
    }

    function prevTrack() {
        if (!masterPlaylist.length) return;
        buildQueue();
        let currentIdxInQueue = currentQueue.findIndex(s => s.id === masterPlaylist[currentSongIndex]?.id);
        if (currentIdxInQueue === -1) currentIdxInQueue = 0;
        let prevIdx = (currentIdxInQueue - 1 + currentQueue.length) % currentQueue.length;
        const prevSong = currentQueue[prevIdx];
        if (prevSong) {
            const newIndex = masterPlaylist.findIndex(s => s.id === prevSong.id);
            if (newIndex !== -1) {
                currentSongIndex = newIndex;
                loadSong(currentSongIndex);
                playCurrent();
            }
        }
    }

    function updatePlayButton() {
        playPauseBtn.innerHTML = isPlaying ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play"></i>';
    }

    function renderPlaylist() {
        playlistContainer.innerHTML = '';
        if (!masterPlaylist.length) {
            emptyMsg.style.display = 'block';
            return;
        }
        emptyMsg.style.display = 'none';
        masterPlaylist.forEach((song, idx) => {
            const trackDiv = document.createElement('div');
            trackDiv.className = `track-item ${currentSongIndex === idx ? 'active-track' : ''}`;
            trackDiv.innerHTML = `
                <div class="track-info">
                    <div><strong>${idx+1}</strong></div>
                    <div><div class="track-title">${escapeHtml(song.title)}</div><div style="font-size:12px;color:#aaa;">${escapeHtml(song.artist)}</div></div>
                </div>
                <div class="track-actions">
                    <button class="edit-song" data-idx="${idx}"><i class="fas fa-pencil-alt"></i></button>
                    <button class="delete-song" data-idx="${idx}"><i class="fas fa-trash-alt"></i></button>
                </div>
            `;
            // Play ketika klik area info lagu
            trackDiv.querySelector('.track-info').addEventListener('click', () => {
                currentSongIndex = idx;
                loadSong(currentSongIndex);
                playCurrent();
            });
            // Jika admin, aktifkan edit/hapus
            if (currentUser && currentUser.role === 'admin') {
                const editBtn = trackDiv.querySelector('.edit-song');
                const delBtn = trackDiv.querySelector('.delete-song');
                editBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const newTitle = prompt("Edit judul:", song.title);
                    const newArtist = prompt("Edit artis:", song.artist);
                    const newUrl = prompt("Edit URL MP3 (harus .mp3):", song.url);
                    if (newTitle && newTitle.trim()) song.title = newTitle.trim();
                    if (newArtist && newArtist.trim()) song.artist = newArtist.trim();
                    if (newUrl && newUrl.trim()) {
                        if (newUrl.match(/\.mp3$/i)) song.url = newUrl.trim();
                        else alert("URL harus berakhiran .mp3");
                    }
                    saveMasterPlaylist();
                    if (currentSongIndex === idx) {
                        nowPlayingTitle.innerText = song.title;
                        nowPlayingArtist.innerText = song.artist;
                        audio.src = song.url;
                        audio.load();
                        if (isPlaying) audio.play();
                    }
                    renderPlaylist();
                });
                delBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (confirm(`Hapus lagu "${song.title}"?`)) {
                        masterPlaylist.splice(idx, 1);
                        if (masterPlaylist.length === 0) {
                            audio.pause();
                            isPlaying = false;
                            nowPlayingTitle.innerText = "Tidak ada lagu";
                            vinylDisc.classList.remove('vinyl-spin');
                            currentSongIndex = -1;
                        } else {
                            if (currentSongIndex >= idx) currentSongIndex = Math.max(0, currentSongIndex-1);
                            if (currentSongIndex >= masterPlaylist.length) currentSongIndex = masterPlaylist.length-1;
                            if (currentSongIndex !== -1 && masterPlaylist[currentSongIndex]) loadSong(currentSongIndex);
                            else if (masterPlaylist.length) { currentSongIndex = 0; loadSong(0); }
                        }
                        saveMasterPlaylist();
                        renderPlaylist();
                    }
                });
            }
            playlistContainer.appendChild(trackDiv);
        });
    }

    function addSongByAdmin() {
        if (!currentUser || currentUser.role !== 'admin') {
            adminError.innerText = "Hanya admin yang bisa menambah lagu";
            return;
        }
        let url = adminUrl.value.trim();
        let title = adminTitle.value.trim();
        let artist = adminArtist.value.trim();
        if (!url) { adminError.innerText = "Masukkan link MP3 (Catbox)"; return; }
        if (!url.match(/\.mp3$/i)) { adminError.innerText = "URL harus berakhiran .mp3"; return; }
        if (!title) title = "Lagu Tanpa Judul";
        if (!artist) artist = "Unknown Artist";
        const newId = Date.now();
        masterPlaylist.push({ id: newId, url, title, artist });
        saveMasterPlaylist();
        if (masterPlaylist.length === 1 && !audio.src) {
            currentSongIndex = 0;
            loadSong(0);
        }
        renderPlaylist();
        adminUrl.value = '';
        adminTitle.value = '';
        adminArtist.value = '';
        adminError.innerText = '';
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]));
    }

    function formatTime(sec) {
        if (isNaN(sec) || !isFinite(sec)) return "0:00";
        const mins = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${mins}:${s < 10 ? '0' : ''}${s}`;
    }

    // ---------- AUTH ----------
    function initDefaultAdmin() {
        if (!users.find(u => u.email === 'admin@harmony.com')) {
            users.push({ email: 'admin@harmony.com', password: 'admin123', role: 'admin' });
            saveUsers();
        }
        if (masterPlaylist.length === 0) {
            // contoh lagu demo (pastikan URL mp3 valid)
            masterPlaylist.push({ id: 1, url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3', title: 'Blinding Lights', artist: 'The Weeknd' });
            masterPlaylist.push({ id: 2, url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3', title: 'Levitating', artist: 'Dua Lipa' });
            saveMasterPlaylist();
        }
    }

    function showAuth(showLogin) {
        loginForm.style.display = showLogin ? 'block' : 'none';
        registerForm.style.display = showLogin ? 'none' : 'block';
        loginError.innerText = '';
        regError.innerText = '';
    }

    function register() {
        const email = regEmail.value.trim();
        const pwd = regPassword.value;
        const confirm = regConfirm.value;
        if (!email || !pwd) { regError.innerText = "Email dan password wajib"; return; }
        if (pwd !== confirm) { regError.innerText = "Password tidak cocok"; return; }
        if (users.find(u => u.email === email)) { regError.innerText = "Email sudah terdaftar"; return; }
        users.push({ email, password: pwd, role: 'user' });
        saveUsers();
        regError.innerText = "Pendaftaran berhasil! Silakan login.";
        setTimeout(() => showAuth(true), 1500);
        regEmail.value = '';
        regPassword.value = '';
        regConfirm.value = '';
    }

    function login() {
        const email = loginEmail.value.trim();
        const pwd = loginPassword.value;
        const user = users.find(u => u.email === email && u.password === pwd);
        if (!user) { loginError.innerText = "Email atau password salah"; return; }
        currentUser = user;
        authPanel.style.display = 'none';
        mainApp.classList.add('active');
        userEmailLabel.innerText = email;
        userRoleLabel.innerText = user.role === 'admin' ? 'Admin' : 'User';
        if (user.role === 'admin') {
            adminSection.classList.add('admin-visible');
        } else {
            adminSection.classList.remove('admin-visible');
        }
        // Load playlist
        if (masterPlaylist.length > 0 && currentSongIndex !== -1) {
            loadSong(currentSongIndex);
        } else if (masterPlaylist.length > 0) {
            currentSongIndex = 0;
            loadSong(0);
        }
        renderPlaylist();
    }

    function logout() {
        currentUser = null;
        audio.pause();
        isPlaying = false;
        authPanel.style.display = 'flex';
        mainApp.classList.remove('active');
        loginEmail.value = '';
        loginPassword.value = '';
        showAuth(true);
        // reset visual
        vinylDisc.classList.remove('vinyl-spin');
    }

    // ---------- Event Listeners ----------
    document.getElementById('doLoginBtn').addEventListener('click', login);
    document.getElementById('doRegisterBtn').addEventListener('click', register);
    document.getElementById('showRegisterBtn').addEventListener('click', () => showAuth(false));
    document.getElementById('showLoginBtn').addEventListener('click', () => showAuth(true));
    logoutBtn.addEventListener('click', logout);
    adminAddSongBtn.addEventListener('click', addSongByAdmin);

    // Audio event untuk memastikan lagu berjalan full sampai selesai
    audio.addEventListener('timeupdate', () => {
        if (audio.duration && !isNaN(audio.duration)) {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = percent + '%';
            currentTimeSpan.innerText = formatTime(audio.currentTime);
            durationSpan.innerText = formatTime(audio.duration);
        }
    });
    audio.addEventListener('ended', () => {
        // Lanjut ke lagu berikutnya atau ulang jika repeat
        if (repeatMode) {
            loadSong(currentSongIndex);
            playCurrent();
        } else {
            nextTrack();
        }
    });
    // Error handling jika lagu gagal dimuat
    audio.addEventListener('error', (e) => {
        console.warn("Audio error, skip to next");
        nextTrack();
    });
    progressBar.addEventListener('click', (e) => {
        const rect = progressBar.getBoundingClientRect();
        const perc = (e.clientX - rect.left) / rect.width;
        if (audio.duration && !isNaN(audio.duration)) {
            audio.currentTime = perc * audio.duration;
        }
    });
    playPauseBtn.addEventListener('click', () => {
        if (!masterPlaylist.length) return;
        if (isPlaying) pauseCurrent();
        else playCurrent();
    });
    prevBtn.addEventListener('click', prevTrack);
    nextBtn.addEventListener('click', nextTrack);
    shuffleBtn.addEventListener('click', () => {
        shuffleMode = !shuffleMode;
        buildQueue();
        shuffleBtn.style.color = shuffleMode ? '#1DB954' : 'white';
    });
    repeatBtn.addEventListener('click', () => {
        repeatMode = !repeatMode;
        repeatBtn.style.color = repeatMode ? '#1DB954' : 'white';
    });
    speedControl.addEventListener('change', (e) => {
        audio.playbackRate = parseFloat(e.target.value);
    });
    themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('light-theme');
    });

    // Inisialisasi
    initDefaultAdmin();
    showAuth(true);
    if (masterPlaylist.length) {
        currentSongIndex = 0;
        loadSong(0);
    }
</script>
</body>
