<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>HarmonyCast · Catbox Music Player + Edit Lagu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        body {
            background: radial-gradient(circle at 10% 20%, #0c0c12, #050508);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        .music-dashboard {
            max-width: 1400px;
            width: 100%;
            background: rgba(12, 12, 20, 0.65);
            backdrop-filter: blur(16px);
            border-radius: 48px;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 30px 50px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        .app-header {
            padding: 24px 32px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            background: linear-gradient(145deg, #1DB954, #14833b);
            width: 44px;
            height: 44px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: white;
        }
        .logo-area h1 {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #c0c0c0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .badge-cat {
            background: rgba(29,185,84,0.12);
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 13px;
            color: #1DB954;
            border: 1px solid rgba(29,185,84,0.3);
        }
        .player-grid {
            display: flex;
            flex-wrap: wrap;
        }
        .playlist-panel {
            flex: 2;
            min-width: 280px;
            background: rgba(0,0,0,0.25);
            border-radius: 32px;
            margin: 20px 0 20px 24px;
            padding: 20px;
            height: 55vh;
            overflow-y: auto;
        }
        .visualizer-panel {
            flex: 1.5;
            margin: 20px 24px 20px 12px;
            background: rgba(0,0,0,0.25);
            border-radius: 32px;
            padding: 20px;
        }
        .add-song-card {
            background: rgba(255,255,255,0.03);
            border-radius: 28px;
            padding: 16px 20px;
            margin-bottom: 28px;
        }
        .input-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-end;
        }
        .input-field {
            flex: 1;
        }
        .input-field label {
            font-size: 12px;
            text-transform: uppercase;
            color: #aaa;
        }
        .input-field input {
            width: 100%;
            background: #101014;
            border: 1px solid #2a2a32;
            border-radius: 40px;
            padding: 12px 16px;
            color: white;
            outline: none;
        }
        .btn-primary {
            background: #1DB954;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 700;
            color: #000;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .track-item {
            background: rgba(255,255,255,0.03);
            margin-bottom: 8px;
            border-radius: 20px;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .track-item.active-track {
            background: rgba(29,185,84,0.15);
            border-left: 4px solid #1DB954;
        }
        .track-info {
            display: flex;
            gap: 14px;
            align-items: center;
            flex: 1;
        }
        .track-title {
            font-weight: 600;
        }
        .track-artist {
            font-size: 12px;
            color: #aaa;
        }
        .track-actions button {
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            margin-left: 8px;
            font-size: 16px;
        }
        .track-actions button:hover {
            color: #1DB954;
        }
        .track-delete:hover {
            color: #ff5e7e !important;
        }
        .vinyl-container {
            text-align: center;
        }
        .vinyl-disc {
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, #2a2a35 10%, #111 80%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px auto;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5);
        }
        .vinyl-spin {
            animation: spin 5s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .progress-bar {
            background: #2e2e3a;
            height: 6px;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px 0;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: #1DB954;
            border-radius: 10px;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 20px 0;
        }
        .ctrl-btn {
            background: #1f1f2c;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
        .ctrl-btn-big {
            background: #1DB954;
            width: 60px;
            height: 60px;
            font-size: 28px;
            color: black;
        }
        .extra-features {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin: 12px 0;
        }
        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #aaa;
        }
        .lyrics-box {
            background: rgba(0,0,0,0.5);
            border-radius: 24px;
            padding: 16px;
            font-size: 14px;
            color: #ddd;
            margin-top: 20px;
            text-align: center;
        }
        @media (max-width: 820px) {
            .player-grid { flex-direction: column; }
            .playlist-panel, .visualizer-panel { margin: 12px; }
        }
    </style>
</head>
<body>
<div class="music-dashboard">
    <div class="app-header">
        <div class="logo-area">
            <div class="logo-icon"><i class="fas fa-head-side-headphones"></i></div>
            <h1>HarmonyCast</h1>
            <div class="badge-cat"><i class="fab fa-cat"></i> Catbox.moe + Edit</div>
        </div>
    </div>
    <div class="player-grid">
        <div class="playlist-panel">
            <div class="add-song-card">
                <h4 style="margin-bottom: 12px;"><i class="fas fa-plus-circle"></i> Tambah Lagu</h4>
                <div class="input-row">
                    <div class="input-field"><label>Link MP3 (Catbox)</label><input type="text" id="songUrl" placeholder="https://files.catbox.moe/xxxx.mp3"></div>
                    <div class="input-field"><label>Judul</label><input type="text" id="songTitle" placeholder="Judul"></div>
                    <div class="input-field"><label>Artis</label><input type="text" id="songArtist" placeholder="Artis"></div>
                    <button class="btn-primary" id="addSongBtn"><i class="fas fa-plus"></i> Tambah</button>
                </div>
                <div id="urlError" style="color:#f55; font-size:12px; margin-top:6px;"></div>
            </div>
            <div id="playlistContainer" class="track-list"></div>
            <div id="emptyPlaylistMsg" style="text-align:center; padding:40px; color:#6a6a7a;"><i class="fas fa-music"></i> Belum ada lagu. Tambah dari Catbox!</div>
        </div>
        <div class="visualizer-panel">
            <div class="vinyl-container">
                <div class="vinyl-disc" id="vinylDisc"><i class="fas fa-record-vinyl" style="font-size:80px; color:#1DB954;"></i></div>
                <h3 id="nowPlayingTitle">Belum ada lagu</h3>
                <p id="nowPlayingArtist">-</p>
            </div>
            <div class="progress-section">
                <div class="time-info"><span id="currentTime">0:00</span><span id="durationTime">0:00</span></div>
                <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
            </div>
            <div class="controls">
                <button class="ctrl-btn" id="shuffleBtn"><i class="fas fa-random"></i></button>
                <button class="ctrl-btn" id="prevBtn"><i class="fas fa-step-backward"></i></button>
                <button class="ctrl-btn ctrl-btn-big" id="playPauseBtn"><i class="fas fa-play"></i></button>
                <button class="ctrl-btn" id="nextBtn"><i class="fas fa-step-forward"></i></button>
                <button class="ctrl-btn" id="repeatBtn"><i class="fas fa-redo-alt"></i></button>
            </div>
            <div class="extra-features">
                <select id="speedControl" style="background:#1a1a24; border-radius:40px; padding:6px 12px; color:white;">
                    <option value="1">1.0x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2.0x</option>
                </select>
                <button id="themeToggle" style="background: none; border:1px solid #2e2e3a; border-radius:40px; padding:6px 12px; color:white;"><i class="fas fa-moon"></i> Dark/Light</button>
            </div>
            <div class="lyrics-box" id="lyricsBox">🎤 Pilih lagu dan nikmati musik dari Catbox</div>
        </div>
    </div>
</div>

<script>
    // ========== DATA & GLOBAL ==========
    let playlist = JSON.parse(localStorage.getItem('harmonycast_playlist')) || [];
    let currentSongIndex = 0;
    let isPlaying = false;
    let shuffleMode = false;
    let repeatMode = false;
    let audio = new Audio();
    let currentQueueIndices = [];

    // DOM elements
    const playlistContainer = document.getElementById('playlistContainer');
    const emptyMsg = document.getElementById('emptyPlaylistMsg');
    const nowPlayingTitleSpan = document.getElementById('nowPlayingTitle');
    const nowPlayingArtistSpan = document.getElementById('nowPlayingArtist');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressFill = document.getElementById('progressFill');
    const progressBar = document.getElementById('progressBar');
    const currentTimeSpan = document.getElementById('currentTime');
    const durationSpan = document.getElementById('durationTime');
    const vinylDisc = document.getElementById('vinylDisc');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const repeatBtn = document.getElementById('repeatBtn');
    const speedControl = document.getElementById('speedControl');
    const themeToggle = document.getElementById('themeToggle');
    const lyricsBox = document.getElementById('lyricsBox');
    const addSongBtn = document.getElementById('addSongBtn');
    const songUrlInput = document.getElementById('songUrl');
    const songTitleInput = document.getElementById('songTitle');
    const songArtistInput = document.getElementById('songArtist');
    const urlErrorDiv = document.getElementById('urlError');

    // ========== FUNGSI INTI ==========
    function savePlaylist() {
        localStorage.setItem('harmonycast_playlist', JSON.stringify(playlist));
        renderPlaylist();
        updateEmptyMsg();
        if (playlist.length === 0 && audio.src) {
            audio.pause();
            isPlaying = false;
            updatePlayPauseButton();
            nowPlayingTitleSpan.innerText = "Belum ada lagu";
            nowPlayingArtistSpan.innerText = "-";
            vinylDisc.classList.remove('vinyl-spin');
        }
    }

    function updateEmptyMsg() {
        if (playlist.length === 0) emptyMsg.style.display = "block";
        else emptyMsg.style.display = "none";
    }

    function buildQueue() {
        if (shuffleMode) {
            let indices = Array.from(Array(playlist.length).keys());
            for (let i = indices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [indices[i], indices[j]] = [indices[j], indices[i]];
            }
            currentQueueIndices = indices;
        } else {
            currentQueueIndices = Array.from(Array(playlist.length).keys());
        }
        if (currentQueueIndices.length > 0 && !currentQueueIndices.includes(currentSongIndex)) {
            currentSongIndex = currentQueueIndices[0];
        }
    }

    function loadSong(index) {
        if (playlist.length === 0 || index < 0 || index >= playlist.length) return false;
        const song = playlist[index];
        audio.src = song.url;
        audio.load();
        nowPlayingTitleSpan.innerText = song.title;
        nowPlayingArtistSpan.innerText = song.artist;
        lyricsBox.innerHTML = `🎵 Now playing: ${song.title} — ${song.artist}<br>🔗 Stream dari Catbox.moe`;
        if (isPlaying) {
            audio.play().catch(e => console.log);
            vinylDisc.classList.add('vinyl-spin');
        } else {
            vinylDisc.classList.remove('vinyl-spin');
        }
        updatePlayPauseButton();
        renderPlaylist(); // refresh active highlight
        return true;
    }

    function playCurrent() {
        if (playlist.length === 0) return;
        if (currentSongIndex === -1) currentSongIndex = 0;
        audio.play().then(() => {
            isPlaying = true;
            vinylDisc.classList.add('vinyl-spin');
            updatePlayPauseButton();
        }).catch(e => console.log);
    }

    function pauseCurrent() {
        audio.pause();
        isPlaying = false;
        vinylDisc.classList.remove('vinyl-spin');
        updatePlayPauseButton();
    }

    function nextTrack() {
        if (playlist.length === 0) return;
        if (currentQueueIndices.length === 0) buildQueue();
        let curPos = currentQueueIndices.indexOf(currentSongIndex);
        if (curPos === -1) { buildQueue(); curPos = currentQueueIndices.indexOf(currentSongIndex); }
        let nextPos = (curPos + 1) % currentQueueIndices.length;
        if (repeatMode && currentQueueIndices.length === 1 && nextPos === 0) {
            loadSong(currentSongIndex);
            playCurrent();
            return;
        }
        const nextIdx = currentQueueIndices[nextPos];
        if (nextIdx !== undefined) {
            currentSongIndex = nextIdx;
            loadSong(currentSongIndex);
            playCurrent();
        } else if (!repeatMode && curPos === currentQueueIndices.length-1) {
            pauseCurrent();
            currentSongIndex = -1;
        }
    }

    function prevTrack() {
        if (playlist.length === 0) return;
        if (currentQueueIndices.length === 0) buildQueue();
        let curPos = currentQueueIndices.indexOf(currentSongIndex);
        if (curPos === -1) { buildQueue(); curPos = currentQueueIndices.indexOf(currentSongIndex); }
        let prevPos = (curPos - 1 + currentQueueIndices.length) % currentQueueIndices.length;
        const prevIdx = currentQueueIndices[prevPos];
        if (prevIdx !== undefined) {
            currentSongIndex = prevIdx;
            loadSong(currentSongIndex);
            playCurrent();
        }
    }

    function updatePlayPauseButton() {
        playPauseBtn.innerHTML = isPlaying ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play"></i>';
    }

    // ========== RENDER PLAYLIST DENGAN TOMBOL EDIT & HAPUS ==========
    function renderPlaylist() {
        playlistContainer.innerHTML = '';
        if (playlist.length === 0) {
            emptyMsg.style.display = "block";
            return;
        }
        emptyMsg.style.display = "none";
        playlist.forEach((song, idx) => {
            const trackDiv = document.createElement('div');
            trackDiv.className = `track-item ${currentSongIndex === idx ? 'active-track' : ''}`;
            trackDiv.innerHTML = `
                <div class="track-info">
                    <div><span style="font-weight:600;">${idx+1}</span></div>
                    <div>
                        <div class="track-title">${escapeHtml(song.title)}</div>
                        <div class="track-artist">${escapeHtml(song.artist)}</div>
                    </div>
                </div>
                <div class="track-actions">
                    <button class="track-edit" data-idx="${idx}"><i class="fas fa-pencil-alt"></i></button>
                    <button class="track-delete" data-idx="${idx}"><i class="fas fa-trash-alt"></i></button>
                </div>
            `;
            // Play saat klik area utama
            trackDiv.querySelector('.track-info').addEventListener('click', (e) => {
                e.stopPropagation();
                currentSongIndex = idx;
                buildQueue();
                loadSong(currentSongIndex);
                playCurrent();
                renderPlaylist();
            });
            // Tombol Edit
            const editBtn = trackDiv.querySelector('.track-edit');
            editBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const newTitle = prompt("Edit judul lagu:", song.title);
                const newArtist = prompt("Edit artis:", song.artist);
                const newUrl = prompt("Edit URL MP3 (Catbox):", song.url);
                if (newTitle && newTitle.trim()) song.title = newTitle.trim();
                if (newArtist && newArtist.trim()) song.artist = newArtist.trim();
                if (newUrl && newUrl.trim() && newUrl.match(/\.mp3$/i)) song.url = newUrl.trim();
                else if (newUrl && newUrl.trim()) alert("URL harus berakhiran .mp3");
                savePlaylist();
                if (currentSongIndex === idx) {
                    nowPlayingTitleSpan.innerText = song.title;
                    nowPlayingArtistSpan.innerText = song.artist;
                    audio.src = song.url;
                    audio.load();
                    if (isPlaying) audio.play();
                }
            });
            // Tombol Hapus
            const delBtn = trackDiv.querySelector('.track-delete');
            delBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (confirm(`Hapus "${song.title}" ?`)) {
                    playlist.splice(idx, 1);
                    if (playlist.length === 0) {
                        audio.pause();
                        isPlaying = false;
                        nowPlayingTitleSpan.innerText = "Belum ada lagu";
                        vinylDisc.classList.remove('vinyl-spin');
                        currentSongIndex = -1;
                    } else {
                        if (currentSongIndex >= idx) currentSongIndex = Math.max(0, currentSongIndex-1);
                        if (currentSongIndex >= playlist.length) currentSongIndex = playlist.length-1;
                        buildQueue();
                        if (currentSongIndex !== -1 && playlist[currentSongIndex]) loadSong(currentSongIndex);
                        else if (playlist.length>0) { currentSongIndex=0; loadSong(0); }
                    }
                    savePlaylist();
                }
            });
            playlistContainer.appendChild(trackDiv);
        });
    }

    function addSong() {
        let url = songUrlInput.value.trim();
        let title = songTitleInput.value.trim();
        let artist = songArtistInput.value.trim();
        if (!url) { urlErrorDiv.innerText = "Masukkan link Catbox .mp3"; return; }
        if (!url.match(/\.mp3$/i) || !url.includes('files.catbox.moe')) {
            urlErrorDiv.innerText = "Harus link langsung .mp3 dari catbox.moe";
            return;
        }
        if (!title) title = "Lagu dari Catbox";
        if (!artist) artist = "Unknown Artist";
        playlist.push({ url, title, artist });
        savePlaylist();
        if (playlist.length === 1 && !audio.src) {
            currentSongIndex = 0;
            buildQueue();
            loadSong(0);
        } else {
            buildQueue();
            renderPlaylist();
        }
        songUrlInput.value = '';
        songTitleInput.value = '';
        songArtistInput.value = '';
        urlErrorDiv.innerText = '';
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m){
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function formatTime(sec) {
        if (isNaN(sec)) return "0:00";
        let mins = Math.floor(sec / 60);
        let s = Math.floor(sec % 60);
        return `${mins}:${s < 10 ? '0' : ''}${s}`;
    }

    // ========== EVENT LISTENER ==========
    audio.addEventListener('timeupdate', () => {
        if (audio.duration && !isNaN(audio.duration)) {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = percent + '%';
            currentTimeSpan.innerText = formatTime(audio.currentTime);
            durationSpan.innerText = formatTime(audio.duration);
        }
    });
    audio.addEventListener('ended', () => {
        if (repeatMode) {
            loadSong(currentSongIndex);
            playCurrent();
        } else {
            nextTrack();
        }
    });
    progressBar.addEventListener('click', (e) => {
        const rect = progressBar.getBoundingClientRect();
        const perc = (e.clientX - rect.left) / rect.width;
        if (audio.duration) audio.currentTime = perc * audio.duration;
    });
    playPauseBtn.addEventListener('click', () => {
        if (playlist.length === 0) return;
        if (isPlaying) pauseCurrent();
        else playCurrent();
    });
    prevBtn.addEventListener('click', prevTrack);
    nextBtn.addEventListener('click', nextTrack);
    shuffleBtn.addEventListener('click', () => {
        shuffleMode = !shuffleMode;
        buildQueue();
        shuffleBtn.style.color = shuffleMode ? '#1DB954' : 'white';
    });
    repeatBtn.addEventListener('click', () => {
        repeatMode = !repeatMode;
        repeatBtn.style.color = repeatMode ? '#1DB954' : 'white';
    });
    speedControl.addEventListener('change', (e) => {
        audio.playbackRate = parseFloat(e.target.value);
    });
    themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('light-theme');
    });
    addSongBtn.addEventListener('click', addSong);

    // Light theme style
    const styleLight = document.createElement('style');
    styleLight.textContent = `
        body.light-theme { background: #e9ecef; }
        body.light-theme .music-dashboard { background: rgba(245,245,255,0.9); backdrop-filter: blur(12px); border-color: #ccc; }
        body.light-theme .track-item, body.light-theme .add-song-card { background: rgba(0,0,0,0.05); }
        body.light-theme .track-title { color: #000; }
        body.light-theme .track-artist { color: #444; }
        body.light-theme .ctrl-btn { background: #ddd; color: #111; }
        body.light-theme .input-field input { background: #fff; color: #000; border-color: #bbb; }
    `;
    document.head.appendChild(styleLight);

    // INIT
    function init() {
        renderPlaylist();
        updateEmptyMsg();
        if (playlist.length > 0) {
            currentSongIndex = 0;
            buildQueue();
            loadSong(currentSongIndex);
        } else {
            nowPlayingTitleSpan.innerText = "✨ Tambah lagu dari Catbox";
        }
    }
    init();
</script>
</body>
</html>
