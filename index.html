<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>HarmonyFlow · Music + Smart Ads</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #000; height: 100vh; overflow: hidden; }
        /* Auth Modal */
        .auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); backdrop-filter: blur(20px); z-index: 1000;
            display: flex; align-items: center; justify-content: center;
        }
        .auth-card {
            background: #121212; border-radius: 32px; padding: 40px; width: 90%; max-width: 460px;
            text-align: center; border: 1px solid rgba(255,255,255,0.1);
        }
        .auth-logo { font-size: 48px; color: #1DB954; margin-bottom: 16px; }
        .auth-card h2 { font-size: 28px; margin-bottom: 24px; color: white; }
        .input-group { margin-bottom: 16px; }
        .input-group input {
            width: 100%; padding: 14px 18px; background: #1f1f1f; border: 1px solid #2a2a2a;
            border-radius: 40px; font-size: 16px; color: white; outline: none;
        }
        .input-group input:focus { border-color: #1DB954; }
        .auth-btn {
            background: #1DB954; width: 100%; padding: 14px; border: none; border-radius: 40px;
            font-weight: 700; font-size: 16px; color: black; cursor: pointer; margin-top: 8px;
        }
        .toggle-auth { margin-top: 20px; color: #b3b3b3; cursor: pointer; font-size: 14px; }
        .toggle-auth span { color: #1DB954; font-weight: 600; }
        .error-msg { color: #f15e5e; font-size: 13px; margin-top: 10px; }
        /* Main App */
        .main-app { display: none; height: 100vh; flex-direction: column; background: #000; }
        .main-app.active { display: flex; }
        .top-bar {
            background: rgba(0,0,0,0.8); backdrop-filter: blur(12px); padding: 12px 24px;
            display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .logo { display: flex; align-items: center; gap: 10px; }
        .logo i { font-size: 32px; color: #1DB954; }
        .logo span { font-size: 22px; font-weight: 800; color: white; }
        .user-menu {
            display: flex; align-items: center; gap: 16px; background: #1f1f1f;
            padding: 6px 16px 6px 12px; border-radius: 40px;
        }
        .user-avatar { width: 32px; height: 32px; background: #1DB954; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: black; text-transform: uppercase; }
        .user-name { color: white; font-weight: 500; }
        .user-role { background: #2a2a2a; padding: 4px 12px; border-radius: 40px; font-size: 12px; color: #1DB954; }
        .logout-btn { background: none; border: none; color: #b3b3b3; cursor: pointer; font-size: 18px; }
        .spotify-layout { display: flex; flex: 1; overflow: hidden; padding: 16px 24px; gap: 20px; }
        .sidebar { width: 260px; background: #0a0a0a; border-radius: 24px; padding: 20px 12px; }
        .nav-item {
            display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-radius: 12px;
            color: #b3b3b3; transition: 0.2s; cursor: pointer; margin-bottom: 8px;
        }
        .nav-item.active, .nav-item:hover { background: #1f1f1f; color: white; }
        .playlist-header { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #aaa; padding: 8px 16px; margin-top: 20px; }
        .create-playlist-btn { background: rgba(29,185,84,0.2); margin-top: 12px; color: #1DB954; }
        .main-content { flex: 1; background: #121212; border-radius: 24px; overflow-y: auto; padding: 24px; }
        .greeting { font-size: 28px; font-weight: 700; margin-bottom: 28px; color: white; }
        .admin-panel {
            background: #1e1e1e; border-radius: 20px; padding: 20px; margin-bottom: 30px;
            display: none; border: 1px solid #2c2c2c;
        }
        .admin-panel.show { display: block; }
        .admin-panel h3 { color: white; margin-bottom: 16px; }
        .admin-form { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
        .admin-form input { flex: 1; background: #0f0f0f; border: 1px solid #2a2a2a; border-radius: 40px; padding: 12px 16px; color: white; }
        .admin-form button { background: #1DB954; border: none; padding: 12px 24px; border-radius: 40px; font-weight: 700; cursor: pointer; }
        .track-grid { display: flex; flex-direction: column; gap: 8px; }
        .track-row {
            background: #181818; border-radius: 12px; padding: 12px 18px;
            display: flex; align-items: center; justify-content: space-between; cursor: pointer;
        }
        .track-row:hover { background: #282828; }
        .track-row.active { background: #2a2a2a; border-left: 4px solid #1DB954; }
        .track-info { display: flex; align-items: center; gap: 18px; flex: 1; }
        .track-icon { width: 48px; height: 48px; background: #2a2a2a; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #1DB954; }
        .track-title { font-weight: 600; color: white; }
        .track-artist { font-size: 13px; color: #b3b3b3; }
        .track-actions { display: flex; gap: 12px; }
        .track-actions button { background: none; border: none; color: #b3b3b3; cursor: pointer; font-size: 16px; }
        .now-playing-bar {
            background: #181818; border-top: 1px solid #282828; padding: 12px 24px;
            display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;
        }
        .now-playing-info { display: flex; align-items: center; gap: 16px; min-width: 180px; }
        .mini-vinyl { width: 56px; height: 56px; background: radial-gradient(circle, #2a2a2a, #111); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #1DB954; font-size: 28px; }
        .player-controls { display: flex; gap: 24px; align-items: center; }
        .ctrl-icon { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
        .ctrl-icon.play { font-size: 40px; color: #1DB954; }
        .progress-container { flex: 1; min-width: 200px; display: flex; align-items: center; gap: 12px; }
        .time { font-size: 12px; color: #b3b3b3; }
        .progress-bar { flex: 1; height: 4px; background: #404040; border-radius: 4px; cursor: pointer; }
        .progress-fill { width: 0%; height: 100%; background: #1DB954; border-radius: 4px; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .vinyl-spin { animation: spin 4s linear infinite; }
        @media (max-width: 800px) { .spotify-layout { flex-direction: column; } .sidebar { width: 100%; display: flex; gap: 12px; overflow-x: auto; } }
    </style>
</head>
<body>

<!-- AUTH OVERLAY -->
<div id="authOverlay" class="auth-overlay">
    <div class="auth-card">
        <div class="auth-logo"><i class="fas fa-headphones"></i></div>
        <h2>HarmonyFlow</h2>
        <div id="loginPanel">
            <div class="input-group"><input type="email" id="loginEmail" placeholder="Email"></div>
            <div class="input-group"><input type="password" id="loginPassword" placeholder="Password"></div>
            <button class="auth-btn" id="loginBtn">Login</button>
            <div class="toggle-auth" id="showRegBtn">Belum punya akun? <span>Daftar</span></div>
            <div id="loginErr" class="error-msg"></div>
        </div>
        <div id="registerPanel" style="display:none;">
            <div class="input-group"><input type="email" id="regEmail" placeholder="Email"></div>
            <div class="input-group"><input type="password" id="regPassword" placeholder="Password"></div>
            <div class="input-group"><input type="password" id="regConfirm" placeholder="Konfirmasi Password"></div>
            <button class="auth-btn" id="registerBtn">Daftar</button>
            <div class="toggle-auth" id="showLoginBtn"><span>← Kembali ke Login</span></div>
            <div id="regErr" class="error-msg"></div>
        </div>
    </div>
</div>

<!-- MAIN APP -->
<div id="mainApp" class="main-app">
    <div class="top-bar">
        <div class="logo"><i class="fas fa-head-side-headphones"></i><span>HarmonyFlow</span></div>
        <div class="user-menu">
            <div class="user-avatar" id="userAvatar"></div>
            <span class="user-name" id="userNameDisplay"></span>
            <span class="user-role" id="userRoleBadge"></span>
            <button class="logout-btn" id="logoutBtnMain"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </div>
    <div class="spotify-layout">
        <div class="sidebar">
            <div class="nav-item active" data-view="home"><i class="fas fa-home"></i> Beranda</div>
            <div class="nav-item" data-view="liked"><i class="fas fa-heart"></i> Lagu Disukai</div>
            <div class="playlist-header">PLAYLIST SAYA</div>
            <div id="userPlaylistList"></div>
            <div class="nav-item create-playlist-btn" id="createPlaylistBtn"><i class="fas fa-plus"></i> Buat Playlist Baru</div>
        </div>
        <div class="main-content" id="mainContent">
            <div id="dynamicView"></div>
        </div>
    </div>
    <!-- Now Playing Bar -->
    <div class="now-playing-bar">
        <div class="now-playing-info">
            <div class="mini-vinyl" id="miniVinyl"><i class="fas fa-record-vinyl"></i></div>
            <div><div id="nowPlayingTitle" style="font-weight:600;">Pilih lagu</div><div id="nowPlayingArtist" style="font-size:12px;">-</div></div>
        </div>
        <div class="player-controls">
            <button class="ctrl-icon" id="shuffleControl"><i class="fas fa-random"></i></button>
            <button class="ctrl-icon" id="prevControl"><i class="fas fa-step-backward"></i></button>
            <button class="ctrl-icon play" id="playPauseControl"><i class="fas fa-play-circle"></i></button>
            <button class="ctrl-icon" id="nextControl"><i class="fas fa-step-forward"></i></button>
            <button class="ctrl-icon" id="repeatControl"><i class="fas fa-redo-alt"></i></button>
        </div>
        <div class="progress-container">
            <span class="time" id="currentTimeText">0:00</span>
            <div class="progress-bar" id="progressBarGlobal"><div class="progress-fill" id="progressFillGlobal"></div></div>
            <span class="time" id="durationText">0:00</span>
            <select id="speedSelect" style="background:#2a2a2a; border-radius:20px; padding:4px 8px; color:white; border:none;">
                <option value="1">1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2x</option>
            </select>
        </div>
    </div>
</div>

<script>
    // ========== DATA & STORAGE ==========
    let users = JSON.parse(localStorage.getItem('harmony_users')) || [];
    let masterPlaylist = JSON.parse(localStorage.getItem('harmony_master_playlist')) || [];
    let currentUser = null;
    let currentSongIndex = 0;
    let isPlaying = false;
    let shuffleMode = false;
    let repeatMode = false;
    let likedSongs = [];
    let userPlaylists = [];
    let audio = new Audio();
    let currentQueue = [];
    let currentView = 'home';
    let currentPlaylistId = null;
    let adText = localStorage.getItem('harmony_ad_text') || "Tempat Top Up Game terpercaya hanya di FAJRUSHSTORE";
    let isAdPlaying = false;
    let adTimeoutId = null;
    let savedPlaybackPosition = 0; // untuk resume setelah iklan

    // DOM elements
    const authOverlay = document.getElementById('authOverlay');
    const mainApp = document.getElementById('mainApp');
    const dynamicView = document.getElementById('dynamicView');
    const userPlaylistListDiv = document.getElementById('userPlaylistList');
    const nowPlayingTitle = document.getElementById('nowPlayingTitle');
    const nowPlayingArtist = document.getElementById('nowPlayingArtist');
    const playPauseBtn = document.getElementById('playPauseControl');
    const prevBtn = document.getElementById('prevControl');
    const nextBtn = document.getElementById('nextControl');
    const progressFill = document.getElementById('progressFillGlobal');
    const progressBar = document.getElementById('progressBarGlobal');
    const currentTimeSpan = document.getElementById('currentTimeText');
    const durationSpan = document.getElementById('durationText');
    const miniVinyl = document.getElementById('miniVinyl');
    const shuffleCtrl = document.getElementById('shuffleControl');
    const repeatCtrl = document.getElementById('repeatControl');
    const speedSelect = document.getElementById('speedSelect');
    const userAvatar = document.getElementById('userAvatar');
    const userNameDisplay = document.getElementById('userNameDisplay');
    const userRoleBadge = document.getElementById('userRoleBadge');
    const logoutBtnMain = document.getElementById('logoutBtnMain');
    const createPlaylistBtn = document.getElementById('createPlaylistBtn');

    // Helper: save data
    function saveUsers() { localStorage.setItem('harmony_users', JSON.stringify(users)); }
    function saveMasterPlaylist() { localStorage.setItem('harmony_master_playlist', JSON.stringify(masterPlaylist)); }
    function saveLiked() { localStorage.setItem(`harmony_liked_${currentUser.email}`, JSON.stringify(likedSongs)); }
    function loadLiked() { likedSongs = JSON.parse(localStorage.getItem(`harmony_liked_${currentUser.email}`)) || []; }
    function saveUserPlaylists() { localStorage.setItem(`harmony_playlists_${currentUser.email}`, JSON.stringify(userPlaylists)); }
    function loadUserPlaylists() { userPlaylists = JSON.parse(localStorage.getItem(`harmony_playlists_${currentUser.email}`)) || []; }
    function saveAdText() { localStorage.setItem('harmony_ad_text', adText); }

    // Build queue for shuffle
    function buildQueue() {
        if (shuffleMode) {
            let indices = Array.from(Array(masterPlaylist.length).keys());
            for (let i = indices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [indices[i], indices[j]] = [indices[j], indices[i]];
            }
            currentQueue = indices.map(i => masterPlaylist[i]);
        } else {
            currentQueue = [...masterPlaylist];
        }
        if (currentQueue.length && (!masterPlaylist[currentSongIndex] || !currentQueue.find(s => s.id === masterPlaylist[currentSongIndex]?.id))) {
            currentSongIndex = 0;
        }
    }

    // Schedule random ad while playing
    function scheduleRandomAd() {
        if (adTimeoutId) clearTimeout(adTimeoutId);
        if (!currentUser || currentUser.role === 'admin') return; // admin no ads
        if (!isPlaying || !audio.src || audio.paused || isAdPlaying) return;
        // random interval between 30 and 120 seconds (30000 - 120000 ms)
        const delay = Math.floor(Math.random() * (120000 - 30000 + 1) + 30000);
        adTimeoutId = setTimeout(() => {
            if (isPlaying && !isAdPlaying && currentUser && currentUser.role !== 'admin') {
                playRandomAd();
            }
        }, delay);
    }

    function cancelRandomAd() {
        if (adTimeoutId) {
            clearTimeout(adTimeoutId);
            adTimeoutId = null;
        }
    }

    // Play ad (pause music, speak, then resume)
    function playRandomAd() {
        if (isAdPlaying) return;
        if (!currentUser || currentUser.role === 'admin') return;
        // Pause music and save position
        if (isPlaying) {
            savedPlaybackPosition = audio.currentTime;
            audio.pause();
            isPlaying = false;
            updatePlayIcon();
            miniVinyl.classList.remove('vinyl-spin');
        } else {
            savedPlaybackPosition = audio.currentTime;
        }
        isAdPlaying = true;
        const utterance = new SpeechSynthesisUtterance(adText);
        utterance.lang = 'id-ID';
        utterance.onend = () => {
            isAdPlaying = false;
            // Resume music from saved position if there is a song loaded
            if (audio.src && masterPlaylist.length && currentSongIndex >= 0) {
                audio.currentTime = savedPlaybackPosition;
                audio.play().then(() => {
                    isPlaying = true;
                    miniVinyl.classList.add('vinyl-spin');
                    updatePlayIcon();
                    scheduleRandomAd(); // reschedule after ad finishes
                }).catch(e => console.log("resume error"));
            } else {
                // if no song, just reset
                isPlaying = false;
                updatePlayIcon();
            }
        };
        utterance.onerror = () => {
            isAdPlaying = false;
            if (audio.src) {
                audio.currentTime = savedPlaybackPosition;
                audio.play().catch(e=>console.log);
                isPlaying = true;
                miniVinyl.classList.add('vinyl-spin');
                updatePlayIcon();
                scheduleRandomAd();
            }
        };
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
    }

    // Main play function with ad on click
    function playWithAd() {
        if (!masterPlaylist.length) return;
        if (currentSongIndex === -1) currentSongIndex = 0;
        // If already playing and no ad, do nothing
        if (isPlaying && !isAdPlaying) return;
        // If ad is playing, don't interrupt
        if (isAdPlaying) return;
        // For non-admin, play ad first
        if (currentUser && currentUser.role !== 'admin') {
            if (isPlaying) {
                // already playing, no need ad
                return;
            }
            // Save position if any
            savedPlaybackPosition = audio.currentTime;
            isAdPlaying = true;
            const utterance = new SpeechSynthesisUtterance(adText);
            utterance.lang = 'id-ID';
            utterance.onend = () => {
                isAdPlaying = false;
                // Resume or start from saved position
                if (audio.src && masterPlaylist.length) {
                    audio.currentTime = savedPlaybackPosition;
                    audio.play().then(() => {
                        isPlaying = true;
                        miniVinyl.classList.add('vinyl-spin');
                        updatePlayIcon();
                        scheduleRandomAd();
                    }).catch(e => console.log);
                } else {
                    // load current song
                    if (masterPlaylist[currentSongIndex]) {
                        loadSong(currentSongIndex);
                        audio.play().then(() => {
                            isPlaying = true;
                            miniVinyl.classList.add('vinyl-spin');
                            updatePlayIcon();
                            scheduleRandomAd();
                        }).catch(e => console.log);
                    }
                }
            };
            utterance.onerror = () => {
                isAdPlaying = false;
                // fallback: langsung play
                if (audio.src) {
                    audio.play().then(() => { isPlaying=true; updatePlayIcon(); scheduleRandomAd(); });
                } else if (masterPlaylist[currentSongIndex]) {
                    loadSong(currentSongIndex);
                    audio.play().then(() => { isPlaying=true; updatePlayIcon(); scheduleRandomAd(); });
                }
            };
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        } else {
            // admin langsung play
            if (audio.src) {
                audio.play().then(() => {
                    isPlaying = true;
                    miniVinyl.classList.add('vinyl-spin');
                    updatePlayIcon();
                    scheduleRandomAd();
                }).catch(e => console.log);
            } else if (masterPlaylist[currentSongIndex]) {
                loadSong(currentSongIndex);
                audio.play().then(() => {
                    isPlaying = true;
                    miniVinyl.classList.add('vinyl-spin');
                    updatePlayIcon();
                    scheduleRandomAd();
                });
            }
        }
    }

    function pauseCurrent() {
        if (isAdPlaying) {
            window.speechSynthesis.cancel();
            isAdPlaying = false;
        }
        cancelRandomAd();
        audio.pause();
        isPlaying = false;
        miniVinyl.classList.remove('vinyl-spin');
        updatePlayIcon();
    }

    function loadSong(index) {
        if (!masterPlaylist.length || index < 0 || index >= masterPlaylist.length) return false;
        const song = masterPlaylist[index];
        audio.src = song.url;
        audio.load();
        nowPlayingTitle.innerText = song.title;
        nowPlayingArtist.innerText = song.artist;
        if (isPlaying && !isAdPlaying) {
            audio.play().catch(e=>console.log);
            miniVinyl.classList.add('vinyl-spin');
            scheduleRandomAd();
        } else {
            miniVinyl.classList.remove('vinyl-spin');
        }
        updatePlayIcon();
        renderCurrentView();
        return true;
    }

    function nextTrack() {
        if (!masterPlaylist.length) return;
        pauseCurrent(); // stop current and cancel ad schedule
        buildQueue();
        let curIdxInQueue = currentQueue.findIndex(s => s.id === masterPlaylist[currentSongIndex]?.id);
        if (curIdxInQueue === -1) curIdxInQueue = 0;
        let nextPos = (curIdxInQueue + 1) % currentQueue.length;
        if (repeatMode) {
            // repeat one
            playWithAd(); // will play same song with ad
            return;
        }
        const nextSong = currentQueue[nextPos];
        if (nextSong) {
            const newIdx = masterPlaylist.findIndex(s => s.id === nextSong.id);
            if (newIdx !== -1) {
                currentSongIndex = newIdx;
                loadSong(currentSongIndex);
                playWithAd();
            }
        } else {
            pauseCurrent();
        }
    }

    function prevTrack() {
        if (!masterPlaylist.length) return;
        pauseCurrent();
        buildQueue();
        let curIdxInQueue = currentQueue.findIndex(s => s.id === masterPlaylist[currentSongIndex]?.id);
        if (curIdxInQueue === -1) curIdxInQueue = 0;
        let prevPos = (curIdxInQueue - 1 + currentQueue.length) % currentQueue.length;
        const prevSong = currentQueue[prevPos];
        if (prevSong) {
            const newIdx = masterPlaylist.findIndex(s => s.id === prevSong.id);
            if (newIdx !== -1) {
                currentSongIndex = newIdx;
                loadSong(currentSongIndex);
                playWithAd();
            }
        }
    }

    function updatePlayIcon() {
        playPauseBtn.innerHTML = isPlaying ? '<i class="fas fa-pause-circle"></i>' : '<i class="fas fa-play-circle"></i>';
    }

    function formatTime(sec) { if (isNaN(sec)) return "0:00"; let m = Math.floor(sec/60); let s = Math.floor(sec%60); return `${m}:${s<10?'0':''}${s}`; }

    // Render views
    function renderCurrentView() {
        if (currentView === 'home') renderHome();
        else if (currentView === 'liked') renderLiked();
        else if (currentView === 'playlist_list') renderPlaylistList();
        else if (currentView === 'playlist_detail' && currentPlaylistId) renderPlaylistDetail(currentPlaylistId);
    }

    function renderHome() {
        dynamicView.innerHTML = `<div class="greeting">🎵 Semua Lagu</div><div id="homeTrackList" class="track-grid"></div>`;
        const container = document.getElementById('homeTrackList');
        renderTrackList(container, masterPlaylist);
    }

    function renderLiked() {
        const likedSongsData = masterPlaylist.filter(s => likedSongs.includes(s.id));
        dynamicView.innerHTML = `<div class="greeting">❤️ Lagu Disukai</div><div id="likedTrackList" class="track-grid"></div>`;
        const container = document.getElementById('likedTrackList');
        renderTrackList(container, likedSongsData);
    }

    function renderTrackList(container, songs) {
        container.innerHTML = '';
        if (!songs.length) { container.innerHTML = '<div style="text-align:center; padding:40px; color:#aaa;">Belum ada lagu.</div>'; return; }
        songs.forEach((song, idx) => {
            const row = document.createElement('div');
            row.className = `track-row ${masterPlaylist.findIndex(s=>s.id===song.id) === currentSongIndex ? 'active' : ''}`;
            row.innerHTML = `
                <div class="track-info">
                    <div class="track-icon"><i class="fas fa-music"></i></div>
                    <div><div class="track-title">${escapeHtml(song.title)}</div><div class="track-artist">${escapeHtml(song.artist)}</div></div>
                </div>
                <div class="track-actions">
                    <button class="like-song" data-id="${song.id}"><i class="fas ${likedSongs.includes(song.id) ? 'fa-heart' : 'fa-heart'}" style="color:${likedSongs.includes(song.id) ? '#1DB954' : '#b3b3b3'}"></i></button>
                    ${currentView === 'playlist_detail' ? `<button class="remove-from-playlist" data-id="${song.id}"><i class="fas fa-trash-alt"></i></button>` : ''}
                </div>
            `;
            row.querySelector('.track-info').addEventListener('click', () => {
                const globalIdx = masterPlaylist.findIndex(s => s.id === song.id);
                if (globalIdx !== -1) {
                    currentSongIndex = globalIdx;
                    loadSong(currentSongIndex);
                    playWithAd();
                }
            });
            row.querySelector('.like-song')?.addEventListener('click', (e) => {
                e.stopPropagation();
                if (likedSongs.includes(song.id)) likedSongs = likedSongs.filter(id => id !== song.id);
                else likedSongs.push(song.id);
                saveLiked();
                renderCurrentView();
            });
            if (currentView === 'playlist_detail') {
                row.querySelector('.remove-from-playlist')?.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const playlist = userPlaylists.find(p => p.id === currentPlaylistId);
                    if (playlist) {
                        playlist.songs = playlist.songs.filter(id => id !== song.id);
                        saveUserPlaylists();
                        renderPlaylistDetail(currentPlaylistId);
                    }
                });
            }
            container.appendChild(row);
        });
    }

    function renderPlaylistList() {
        dynamicView.innerHTML = `<div class="greeting">📁 Playlist Saya</div><div id="playlistsContainer" style="display:flex; flex-direction:column; gap:12px;"></div>`;
        const container = document.getElementById('playlistsContainer');
        if (userPlaylists.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:40px; color:#aaa;">Belum ada playlist. Klik "Buat Playlist Baru"</div>';
            return;
        }
        userPlaylists.forEach(pl => {
            const plDiv = document.createElement('div');
            plDiv.style.background = '#1f1f1f'; plDiv.style.borderRadius = '16px'; plDiv.style.padding = '16px'; plDiv.style.display = 'flex'; plDiv.style.justifyContent = 'space-between'; plDiv.style.alignItems = 'center';
            plDiv.innerHTML = `<div><strong style="color:white;">${escapeHtml(pl.name)}</strong><div style="font-size:12px; color:#aaa;">${pl.songs.length} lagu</div></div>
                               <div><button class="view-playlist" data-id="${pl.id}" style="background:#1DB954; border:none; padding:8px 16px; border-radius:40px; margin-right:8px; cursor:pointer;">Buka</button>
                               <button class="edit-playlist" data-id="${pl.id}" style="background:#3a3a3a; border:none; padding:8px 16px; border-radius:40px; margin-right:8px; cursor:pointer;">Edit Nama</button>
                               <button class="delete-playlist" data-id="${pl.id}" style="background:#a33; border:none; padding:8px 16px; border-radius:40px; cursor:pointer;">Hapus</button></div>`;
            container.appendChild(plDiv);
        });
        document.querySelectorAll('.view-playlist').forEach(btn => {
            btn.addEventListener('click', () => {
                currentPlaylistId = parseInt(btn.dataset.id);
                currentView = 'playlist_detail';
                renderPlaylistDetail(currentPlaylistId);
                updateSidebarActive();
            });
        });
        document.querySelectorAll('.edit-playlist').forEach(btn => {
            btn.addEventListener('click', () => {
                const id = parseInt(btn.dataset.id);
                const pl = userPlaylists.find(p => p.id === id);
                const newName = prompt("Nama playlist baru:", pl.name);
                if (newName && newName.trim()) { pl.name = newName.trim(); saveUserPlaylists(); renderPlaylistList(); }
            });
        });
        document.querySelectorAll('.delete-playlist').forEach(btn => {
            btn.addEventListener('click', () => {
                const id = parseInt(btn.dataset.id);
                if (confirm("Hapus playlist ini?")) { userPlaylists = userPlaylists.filter(p => p.id !== id); saveUserPlaylists(); renderPlaylistList(); }
            });
        });
    }

    function renderPlaylistDetail(playlistId) {
        const playlist = userPlaylists.find(p => p.id === playlistId);
        if (!playlist) { currentView = 'playlist_list'; renderPlaylistList(); return; }
        const playlistSongs = masterPlaylist.filter(s => playlist.songs.includes(s.id));
        dynamicView.innerHTML = `<div class="greeting">📀 ${escapeHtml(playlist.name)} <button id="addToPlaylistBtn" style="background:#1DB954; border:none; padding:8px 20px; border-radius:40px; margin-left:20px; cursor:pointer;">+ Tambah Lagu</button></div>
                                 <div id="playlistDetailList" class="track-grid"></div>`;
        const container = document.getElementById('playlistDetailList');
        renderTrackList(container, playlistSongs);
        document.getElementById('addToPlaylistBtn')?.addEventListener('click', () => {
            const songOptions = masterPlaylist.filter(s => !playlist.songs.includes(s.id));
            if (songOptions.length === 0) { alert("Semua lagu sudah ada di playlist ini."); return; }
            let optionsHtml = "<div style='background:#121212; padding:20px; border-radius:24px;'><h4>Tambah Lagu</h4><ul style='list-style:none;'>";
            songOptions.forEach(s => { optionsHtml += `<li style='margin:8px 0; cursor:pointer;' data-id='${s.id}'>${escapeHtml(s.title)} - ${escapeHtml(s.artist)}</li>`; });
            optionsHtml += "</ul><button id='closeModal' style='margin-top:12px;'>Tutup</button></div>";
            const modal = document.createElement('div');
            modal.style.position = 'fixed'; modal.style.top=0; modal.style.left=0; modal.style.width='100%'; modal.style.height='100%'; modal.style.background='rgba(0,0,0,0.8)'; modal.style.display='flex'; modal.style.alignItems='center'; modal.style.justifyContent='center'; modal.style.zIndex=2000;
            modal.innerHTML = optionsHtml;
            document.body.appendChild(modal);
            modal.querySelectorAll('li').forEach(li => {
                li.addEventListener('click', () => {
                    const songId = parseInt(li.dataset.id);
                    if (!playlist.songs.includes(songId)) {
                        playlist.songs.push(songId);
                        saveUserPlaylists();
                        renderPlaylistDetail(playlistId);
                    }
                    document.body.removeChild(modal);
                });
            });
            modal.querySelector('#closeModal')?.addEventListener('click', () => document.body.removeChild(modal));
        });
    }

    function updateSidebarActive() {
        document.querySelectorAll('.nav-item[data-view]').forEach(n => n.classList.remove('active'));
        if (currentView === 'home') document.querySelector('[data-view="home"]').classList.add('active');
        else if (currentView === 'liked') document.querySelector('[data-view="liked"]').classList.add('active');
    }

    function refreshSidebarPlaylists() {
        userPlaylistListDiv.innerHTML = '';
        userPlaylists.forEach(pl => {
            const plDiv = document.createElement('div');
            plDiv.className = 'nav-item';
            plDiv.innerHTML = `<i class="fas fa-list-ul"></i> ${escapeHtml(pl.name)}`;
            plDiv.addEventListener('click', () => {
                currentPlaylistId = pl.id;
                currentView = 'playlist_detail';
                renderPlaylistDetail(pl.id);
                updateSidebarActive();
            });
            userPlaylistListDiv.appendChild(plDiv);
        });
    }

    function escapeHtml(str) { return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

    // Audio event handlers
    audio.addEventListener('timeupdate', () => {
        if (audio.duration && !isNaN(audio.duration)) {
            progressFill.style.width = (audio.currentTime / audio.duration) * 100 + '%';
            currentTimeSpan.innerText = formatTime(audio.currentTime);
            durationSpan.innerText = formatTime(audio.duration);
        }
    });
    audio.addEventListener('ended', () => {
        cancelRandomAd();
        if (repeatMode) {
            playWithAd(); // repeat with ad
        } else {
            nextTrack();
        }
    });
    audio.addEventListener('play', () => {
        if (!isAdPlaying && currentUser && currentUser.role !== 'admin') scheduleRandomAd();
    });
    audio.addEventListener('pause', () => {
        cancelRandomAd();
    });
    progressBar.addEventListener('click', (e) => {
        const rect = progressBar.getBoundingClientRect();
        const perc = (e.clientX - rect.left) / rect.width;
        if (audio.duration) audio.currentTime = perc * audio.duration;
    });
    playPauseBtn.onclick = () => { if (masterPlaylist.length) isPlaying ? pauseCurrent() : playWithAd(); };
    prevBtn.onclick = prevTrack;
    nextBtn.onclick = nextTrack;
    shuffleCtrl.onclick = () => { shuffleMode = !shuffleMode; buildQueue(); shuffleCtrl.style.color = shuffleMode ? '#1DB954' : 'white'; };
    repeatCtrl.onclick = () => { repeatMode = !repeatMode; repeatCtrl.style.color = repeatMode ? '#1DB954' : 'white'; };
    speedSelect.onchange = () => audio.playbackRate = parseFloat(speedSelect.value);
    createPlaylistBtn.onclick = () => {
        let name = prompt("Nama playlist baru:");
        if (name && name.trim()) {
            const newId = Date.now();
            userPlaylists.push({ id: newId, name: name.trim(), songs: [] });
            saveUserPlaylists();
            refreshSidebarPlaylists();
            if (currentView === 'playlist_list') renderPlaylistList();
        }
    };

    // Authentication
    function initDefaultAdmin() {
        if (!users.find(u => u.email === 'admin@harmony.com')) {
            users.push({ email: 'admin@harmony.com', password: 'admin123', role: 'admin' });
            saveUsers();
        }
        if (masterPlaylist.length === 0) {
            masterPlaylist.push({ id: 1, url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3', title: 'Blinding Lights', artist: 'The Weeknd' });
            masterPlaylist.push({ id: 2, url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3', title: 'Levitating', artist: 'Dua Lipa' });
            saveMasterPlaylist();
        }
    }
    function showAuth(showLogin) {
        document.getElementById('loginPanel').style.display = showLogin ? 'block' : 'none';
        document.getElementById('registerPanel').style.display = showLogin ? 'none' : 'block';
    }
    function register() {
        const email = regEmail.value.trim();
        const pwd = regPassword.value;
        const confirm = regConfirm.value;
        if (!email || !pwd) { regErr.innerText = "Email & password wajib"; return; }
        if (pwd !== confirm) { regErr.innerText = "Password tidak cocok"; return; }
        if (users.find(u => u.email === email)) { regErr.innerText = "Email sudah terdaftar"; return; }
        users.push({ email, password: pwd, role: 'user' });
        saveUsers();
        regErr.innerText = "Pendaftaran berhasil! Silakan login.";
        setTimeout(() => showAuth(true), 1500);
        regEmail.value = ''; regPassword.value = ''; regConfirm.value = '';
    }
    function login() {
        const email = loginEmail.value.trim();
        const pwd = loginPassword.value;
        const user = users.find(u => u.email === email && u.password === pwd);
        if (!user) { loginErr.innerText = "Email atau password salah"; return; }
        currentUser = user;
        authOverlay.style.display = 'none';
        mainApp.classList.add('active');
        const initial = email.substring(0,2).toUpperCase();
        userAvatar.innerText = initial;
        userNameDisplay.innerText = email.split('@')[0];
        userRoleBadge.innerText = user.role === 'admin' ? 'Admin' : 'Pengguna';
        loadLiked();
        loadUserPlaylists();
        refreshSidebarPlaylists();
        // Add admin panel if not exists
        if (!document.querySelector('#adminPanel')) {
            const adminHtml = `<div id="adminPanel" class="admin-panel"><h3><i class="fas fa-crown"></i> Admin: Edit Iklan Suara & Tambah Lagu</h3>
                <div class="admin-form"><input type="text" id="adTextInput" value="${adText.replace(/"/g, '&quot;')}" placeholder="Teks iklan suara"><button id="saveAdBtn">Simpan Iklan</button></div>
                <div style="margin-top:20px;"><h4>Tambah Lagu Baru</h4><div class="admin-form"><input type="text" id="adminUrl" placeholder="Link MP3 (Catbox)"><input type="text" id="adminTitle" placeholder="Judul"><input type="text" id="adminArtist" placeholder="Artis"><button id="adminAddSongBtn">Tambah</button></div></div>
                <div id="adminMsg" style="color:#1DB954; font-size:12px; margin-top:8px;"></div>
            </div>`;
            const mainContent = document.querySelector('.main-content');
            mainContent.insertAdjacentHTML('afterbegin', adminHtml);
        }
        const adminPanelDiv = document.getElementById('adminPanel');
        if (user.role === 'admin') adminPanelDiv.classList.add('show');
        else adminPanelDiv.classList.remove('show');
        document.getElementById('adTextInput').value = adText;
        document.getElementById('saveAdBtn')?.addEventListener('click', () => {
            adText = document.getElementById('adTextInput').value.trim();
            if (!adText) adText = "Tempat Top Up Game terpercaya hanya di FAJRUSHSTORE";
            saveAdText();
            document.getElementById('adminMsg').innerText = "Iklan suara diperbarui!";
            setTimeout(() => document.getElementById('adminMsg').innerText = '', 2000);
        });
        document.getElementById('adminAddSongBtn')?.addEventListener('click', () => {
            let url = document.getElementById('adminUrl').value.trim();
            let title = document.getElementById('adminTitle').value.trim();
            let artist = document.getElementById('adminArtist').value.trim();
            if (!url) { adminMsg.innerText = "Link MP3 wajib"; return; }
            if (!url.match(/\.mp3$/i)) { adminMsg.innerText = "URL harus .mp3"; return; }
            if (!title) title = "Lagu Baru";
            if (!artist) artist = "Unknown";
            const newId = Date.now();
            masterPlaylist.push({ id: newId, url, title, artist });
            saveMasterPlaylist();
            renderCurrentView();
            document.getElementById('adminUrl').value = '';
            document.getElementById('adminTitle').value = '';
            document.getElementById('adminArtist').value = '';
            document.getElementById('adminMsg').innerText = "Lagu ditambahkan!";
            setTimeout(() => document.getElementById('adminMsg').innerText = '', 2000);
        });
        currentView = 'home';
        currentSongIndex = 0;
        buildQueue();
        if (masterPlaylist.length) loadSong(0);
        renderHome();
        updateSidebarActive();
    }
    function logout() {
        currentUser = null;
        if (isAdPlaying) window.speechSynthesis.cancel();
        cancelRandomAd();
        audio.pause();
        isPlaying = false;
        mainApp.classList.remove('active');
        authOverlay.style.display = 'flex';
        loginEmail.value = ''; loginPassword.value = '';
        showAuth(true);
    }
    document.getElementById('loginBtn').onclick = login;
    document.getElementById('registerBtn').onclick = register;
    document.getElementById('showRegBtn').onclick = () => showAuth(false);
    document.getElementById('showLoginBtn').onclick = () => showAuth(true);
    logoutBtnMain.onclick = logout;
    document.querySelectorAll('[data-view]').forEach(el => {
        el.addEventListener('click', () => {
            const view = el.dataset.view;
            if (view === 'home') { currentView = 'home'; renderHome(); updateSidebarActive(); }
            else if (view === 'liked') { currentView = 'liked'; renderLiked(); updateSidebarActive(); }
            else if (view === 'playlist_list') { currentView = 'playlist_list'; renderPlaylistList(); updateSidebarActive(); }
        });
    });
    initDefaultAdmin();
    showAuth(true);
</script>
</body>
    </html>
