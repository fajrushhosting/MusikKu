<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>HarmonyFlow · Spotify-like Music Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #000;
            height: 100vh;
            overflow: hidden;
        }

        /* ========== AUTH MODAL (Spotify-like) ========== */
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(20px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .auth-card {
            background: #121212;
            border-radius: 32px;
            padding: 40px;
            width: 90%;
            max-width: 460px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .auth-logo {
            font-size: 48px;
            color: #1DB954;
            margin-bottom: 16px;
        }
        .auth-card h2 {
            font-size: 28px;
            margin-bottom: 24px;
            color: white;
        }
        .input-group {
            margin-bottom: 16px;
        }
        .input-group input {
            width: 100%;
            padding: 14px 18px;
            background: #1f1f1f;
            border: 1px solid #2a2a2a;
            border-radius: 40px;
            font-size: 16px;
            color: white;
            outline: none;
            transition: 0.2s;
        }
        .input-group input:focus {
            border-color: #1DB954;
        }
        .auth-btn {
            background: #1DB954;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 16px;
            color: black;
            cursor: pointer;
            margin-top: 8px;
        }
        .toggle-auth {
            margin-top: 20px;
            color: #b3b3b3;
            cursor: pointer;
            font-size: 14px;
        }
        .toggle-auth span {
            color: #1DB954;
            font-weight: 600;
        }
        .error-msg {
            color: #f15e5e;
            font-size: 13px;
            margin-top: 10px;
        }

        /* ========== MAIN APP (SPOTIFY LAYOUT) ========== */
        .main-app {
            display: none;
            height: 100vh;
            flex-direction: column;
            background: #000;
        }
        .main-app.active {
            display: flex;
        }
        /* Top bar */
        .top-bar {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo i {
            font-size: 32px;
            color: #1DB954;
        }
        .logo span {
            font-size: 22px;
            font-weight: 800;
            color: white;
        }
        .user-menu {
            display: flex;
            align-items: center;
            gap: 16px;
            background: #1f1f1f;
            padding: 6px 16px 6px 12px;
            border-radius: 40px;
        }
        .user-role {
            background: #2a2a2a;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 12px;
            color: #1DB954;
        }
        .logout-btn {
            background: none;
            border: none;
            color: #b3b3b3;
            cursor: pointer;
            font-size: 18px;
        }

        /* Spotify grid layout */
        .spotify-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
            padding: 16px 24px;
            gap: 20px;
        }
        /* Sidebar */
        .sidebar {
            width: 260px;
            background: #0a0a0a;
            border-radius: 24px;
            padding: 20px 12px;
            backdrop-filter: blur(4px);
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 16px;
            border-radius: 12px;
            color: #b3b3b3;
            transition: 0.2s;
            cursor: pointer;
            margin-bottom: 8px;
        }
        .nav-item.active, .nav-item:hover {
            background: #1f1f1f;
            color: white;
        }
        .playlist-section {
            margin-top: 32px;
        }
        .playlist-header {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
            padding: 8px 16px;
        }
        .playlist-item {
            padding: 8px 16px;
            font-size: 14px;
            color: #b3b3b3;
            cursor: pointer;
            border-radius: 8px;
        }
        .playlist-item:hover {
            color: white;
            background: #1f1f1f;
        }
        /* Main content */
        .main-content {
            flex: 1;
            background: #121212;
            border-radius: 24px;
            overflow-y: auto;
            padding: 24px;
        }
        .greeting {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 28px;
            color: white;
        }
        /* Admin panel card */
        .admin-panel {
            background: #1e1e1e;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            display: none;
            border: 1px solid #2c2c2c;
        }
        .admin-panel.show {
            display: block;
        }
        .admin-panel h3 {
            color: white;
            margin-bottom: 16px;
            font-size: 18px;
        }
        .admin-form {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .admin-form input {
            flex: 1;
            background: #0f0f0f;
            border: 1px solid #2a2a2a;
            border-radius: 40px;
            padding: 12px 16px;
            color: white;
        }
        .admin-form button {
            background: #1DB954;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
        }
        /* Track list (grid like Spotify) */
        .track-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .track-row {
            background: #181818;
            border-radius: 12px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: 0.1s;
            cursor: pointer;
        }
        .track-row:hover {
            background: #282828;
        }
        .track-row.active {
            background: #2a2a2a;
            border-left: 4px solid #1DB954;
        }
        .track-info {
            display: flex;
            align-items: center;
            gap: 18px;
        }
        .track-icon {
            width: 48px;
            height: 48px;
            background: #2a2a2a;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1DB954;
            font-size: 20px;
        }
        .track-title {
            font-weight: 600;
            color: white;
        }
        .track-artist {
            font-size: 13px;
            color: #b3b3b3;
        }
        .track-actions {
            display: flex;
            gap: 12px;
        }
        .track-actions button {
            background: none;
            border: none;
            color: #b3b3b3;
            cursor: pointer;
            font-size: 16px;
        }
        /* Now Playing Bar (bottom) */
        .now-playing-bar {
            background: #181818;
            border-top: 1px solid #282828;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }
        .now-playing-info {
            display: flex;
            align-items: center;
            gap: 16px;
            min-width: 180px;
        }
        .mini-vinyl {
            width: 56px;
            height: 56px;
            background: radial-gradient(circle, #2a2a2a, #111);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1DB954;
            font-size: 28px;
        }
        .player-controls {
            display: flex;
            gap: 24px;
            align-items: center;
        }
        .ctrl-icon {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }
        .ctrl-icon.play {
            font-size: 40px;
            color: #1DB954;
        }
        .progress-container {
            flex: 1;
            min-width: 200px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .time {
            font-size: 12px;
            color: #b3b3b3;
        }
        .progress-bar {
            flex: 1;
            height: 4px;
            background: #404040;
            border-radius: 4px;
            cursor: pointer;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: #1DB954;
            border-radius: 4px;
        }
        .extra-controls {
            display: flex;
            gap: 12px;
        }
        @media (max-width: 800px) {
            .spotify-layout {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                display: flex;
                gap: 12px;
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>

<!-- AUTH OVERLAY -->
<div id="authOverlay" class="auth-overlay">
    <div class="auth-card">
        <div class="auth-logo"><i class="fas fa-headphones"></i></div>
        <h2>HarmonyFlow</h2>
        <div id="loginPanel">
            <div class="input-group"><input type="email" id="loginEmail" placeholder="Email"></div>
            <div class="input-group"><input type="password" id="loginPassword" placeholder="Password"></div>
            <button class="auth-btn" id="loginBtn">Login</button>
            <div class="toggle-auth" id="showRegBtn">Belum punya akun? <span>Daftar</span></div>
            <div id="loginErr" class="error-msg"></div>
        </div>
        <div id="registerPanel" style="display:none;">
            <div class="input-group"><input type="email" id="regEmail" placeholder="Email"></div>
            <div class="input-group"><input type="password" id="regPassword" placeholder="Password"></div>
            <div class="input-group"><input type="password" id="regConfirm" placeholder="Konfirmasi Password"></div>
            <button class="auth-btn" id="registerBtn">Daftar</button>
            <div class="toggle-auth" id="showLoginBtn"><span>← Kembali ke Login</span></div>
            <div id="regErr" class="error-msg"></div>
        </div>
    </div>
</div>

<!-- MAIN APP (SPOTIFY STYLE) -->
<div id="mainApp" class="main-app">
    <div class="top-bar">
        <div class="logo">
            <i class="fas fa-head-side-headphones"></i>
            <span>HarmonyFlow</span>
        </div>
        <div class="user-menu">
            <span class="user-role" id="userRoleBadge">User</span>
            <span id="userEmailBadge" style="font-size:14px; color:white;"></span>
            <button class="logout-btn" id="logoutBtnMain"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </div>
    <div class="spotify-layout">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="nav-item active" data-nav="home"><i class="fas fa-home"></i> Beranda</div>
            <div class="nav-item" data-nav="liked"><i class="fas fa-heart"></i> Lagu Disukai</div>
            <div class="playlist-section">
                <div class="playlist-header">PLAYLIST KAMU</div>
                <div class="playlist-item" data-playlist="all">Semua Lagu</div>
                <div class="playlist-item" data-playlist="chill">Chill Mix</div>
                <div class="playlist-item" data-playlist="workout">Workout</div>
            </div>
        </div>
        <!-- Main content -->
        <div class="main-content" id="mainContent">
            <div class="greeting" id="greetingText">Selamat datang, <span id="greetingUser"></span> 🎧</div>
            <!-- Admin Panel -->
            <div id="adminPanel" class="admin-panel">
                <h3><i class="fas fa-crown"></i> Admin Controls</h3>
                <div class="admin-form">
                    <input type="text" id="adminUrl" placeholder="Link MP3 (Catbox)">
                    <input type="text" id="adminTitle" placeholder="Judul Lagu">
                    <input type="text" id="adminArtist" placeholder="Artis">
                    <button id="addSongAdmin">Tambah Lagu</button>
                </div>
                <div id="adminMsg" style="color:#1DB954; font-size:12px; margin-top:8px;"></div>
            </div>
            <!-- Daftar lagu -->
            <div id="trackListContainer" class="track-grid"></div>
            <div id="emptyPlaylistMsg" style="text-align:center; padding:40px; color:#aaa;">Belum ada lagu. Admin dapat menambahkan.</div>
        </div>
    </div>
    <!-- Now Playing Bar -->
    <div class="now-playing-bar">
        <div class="now-playing-info">
            <div class="mini-vinyl" id="miniVinyl"><i class="fas fa-record-vinyl"></i></div>
            <div><div id="nowPlayingTitle" style="font-weight:600;">Pilih lagu</div><div id="nowPlayingArtist" style="font-size:12px; color:#b3b3b3;">-</div></div>
        </div>
        <div class="player-controls">
            <button class="ctrl-icon" id="shuffleControl"><i class="fas fa-random"></i></button>
            <button class="ctrl-icon" id="prevControl"><i class="fas fa-step-backward"></i></button>
            <button class="ctrl-icon play" id="playPauseControl"><i class="fas fa-play-circle"></i></button>
            <button class="ctrl-icon" id="nextControl"><i class="fas fa-step-forward"></i></button>
            <button class="ctrl-icon" id="repeatControl"><i class="fas fa-redo-alt"></i></button>
        </div>
        <div class="progress-container">
            <span class="time" id="currentTimeText">0:00</span>
            <div class="progress-bar" id="progressBarGlobal"><div class="progress-fill" id="progressFillGlobal"></div></div>
            <span class="time" id="durationText">0:00</span>
            <select id="speedSelect" style="background:#2a2a2a; border-radius:20px; padding:4px 8px; color:white; border:none;">
                <option value="1">1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2x</option>
            </select>
        </div>
    </div>
</div>

<script>
    // ---------- DATA & STORAGE ----------
    let users = JSON.parse(localStorage.getItem('harmony_users')) || [];
    let masterPlaylist = JSON.parse(localStorage.getItem('harmony_master_playlist')) || [];
    let currentUser = null;
    let currentSongIndex = 0;
    let isPlaying = false;
    let shuffleMode = false;
    let repeatMode = false;
    let likedSongs = JSON.parse(localStorage.getItem('harmony_liked')) || []; // simpan id lagu yang disukai user
    let audio = new Audio();
    let currentQueue = []; // untuk urutan putar (shuffle)

    // DOM elements
    const authOverlay = document.getElementById('authOverlay');
    const mainApp = document.getElementById('mainApp');
    const trackContainer = document.getElementById('trackListContainer');
    const emptyMsg = document.getElementById('emptyPlaylistMsg');
    const nowPlayingTitle = document.getElementById('nowPlayingTitle');
    const nowPlayingArtist = document.getElementById('nowPlayingArtist');
    const playPauseBtn = document.getElementById('playPauseControl');
    const prevBtn = document.getElementById('prevControl');
    const nextBtn = document.getElementById('nextControl');
    const progressFill = document.getElementById('progressFillGlobal');
    const progressBar = document.getElementById('progressBarGlobal');
    const currentTimeSpan = document.getElementById('currentTimeText');
    const durationSpan = document.getElementById('durationText');
    const miniVinyl = document.getElementById('miniVinyl');
    const shuffleCtrl = document.getElementById('shuffleControl');
    const repeatCtrl = document.getElementById('repeatControl');
    const speedSelect = document.getElementById('speedSelect');
    const greetingUserSpan = document.getElementById('greetingUser');
    const userRoleBadge = document.getElementById('userRoleBadge');
    const userEmailBadge = document.getElementById('userEmailBadge');
    const adminPanelDiv = document.getElementById('adminPanel');
    const adminUrl = document.getElementById('adminUrl');
    const adminTitle = document.getElementById('adminTitle');
    const adminArtist = document.getElementById('adminArtist');
    const addSongAdminBtn = document.getElementById('addSongAdmin');
    const adminMsg = document.getElementById('adminMsg');

    // Auth elements
    const loginPanel = document.getElementById('loginPanel');
    const registerPanel = document.getElementById('registerPanel');
    const loginEmail = document.getElementById('loginEmail');
    const loginPassword = document.getElementById('loginPassword');
    const regEmail = document.getElementById('regEmail');
    const regPassword = document.getElementById('regPassword');
    const regConfirm = document.getElementById('regConfirm');
    const loginErr = document.getElementById('loginErr');
    const regErr = document.getElementById('regErr');
    const showRegBtn = document.getElementById('showRegBtn');
    const showLoginBtn = document.getElementById('showLoginBtn');
    const loginBtn = document.getElementById('loginBtn');
    const registerBtn = document.getElementById('registerBtn');
    const logoutBtnMain = document.getElementById('logoutBtnMain');

    // Helper functions
    function saveUsers() { localStorage.setItem('harmony_users', JSON.stringify(users)); }
    function saveMasterPlaylist() { localStorage.setItem('harmony_master_playlist', JSON.stringify(masterPlaylist)); }
    function saveLiked() { localStorage.setItem('harmony_liked', JSON.stringify(likedSongs)); }

    function buildQueue() {
        if (shuffleMode) {
            let indices = Array.from(Array(masterPlaylist.length).keys());
            for (let i = indices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [indices[i], indices[j]] = [indices[j], indices[i]];
            }
            currentQueue = indices.map(i => masterPlaylist[i]);
        } else {
            currentQueue = [...masterPlaylist];
        }
        if (currentQueue.length && (!masterPlaylist[currentSongIndex] || !currentQueue.find(s => s.id === masterPlaylist[currentSongIndex]?.id))) {
            currentSongIndex = 0;
        }
    }

    function loadSong(index) {
        if (!masterPlaylist.length || index < 0 || index >= masterPlaylist.length) return false;
        const song = masterPlaylist[index];
        audio.src = song.url;
        audio.load();
        nowPlayingTitle.innerText = song.title;
        nowPlayingArtist.innerText = song.artist;
        if (isPlaying) {
            audio.play().catch(e => console.log);
            miniVinyl.classList.add('vinyl-spin');
        } else {
            miniVinyl.classList.remove('vinyl-spin');
        }
        updatePlayIcon();
        renderPlaylist();
        return true;
    }

    function playCurrent() {
        if (!masterPlaylist.length) return;
        if (currentSongIndex === -1) currentSongIndex = 0;
        audio.play().then(() => {
            isPlaying = true;
            miniVinyl.classList.add('vinyl-spin');
            updatePlayIcon();
        }).catch(e => console.log);
    }

    function pauseCurrent() {
        audio.pause();
        isPlaying = false;
        miniVinyl.classList.remove('vinyl-spin');
        updatePlayIcon();
    }

    function nextTrack() {
        if (!masterPlaylist.length) return;
        buildQueue();
        let curIdxInQueue = currentQueue.findIndex(s => s.id === masterPlaylist[currentSongIndex]?.id);
        if (curIdxInQueue === -1) curIdxInQueue = 0;
        let nextPos = (curIdxInQueue + 1) % currentQueue.length;
        if (repeatMode) {
            // repeat one: putar ulang lagu sama
            loadSong(currentSongIndex);
            playCurrent();
            return;
        }
        const nextSong = currentQueue[nextPos];
        if (nextSong) {
            const newIdx = masterPlaylist.findIndex(s => s.id === nextSong.id);
            if (newIdx !== -1) {
                currentSongIndex = newIdx;
                loadSong(currentSongIndex);
                playCurrent();
            }
        } else {
            pauseCurrent();
        }
    }

    function prevTrack() {
        if (!masterPlaylist.length) return;
        buildQueue();
        let curIdxInQueue = currentQueue.findIndex(s => s.id === masterPlaylist[currentSongIndex]?.id);
        if (curIdxInQueue === -1) curIdxInQueue = 0;
        let prevPos = (curIdxInQueue - 1 + currentQueue.length) % currentQueue.length;
        const prevSong = currentQueue[prevPos];
        if (prevSong) {
            const newIdx = masterPlaylist.findIndex(s => s.id === prevSong.id);
            if (newIdx !== -1) {
                currentSongIndex = newIdx;
                loadSong(currentSongIndex);
                playCurrent();
            }
        }
    }

    function updatePlayIcon() {
        playPauseBtn.innerHTML = isPlaying ? '<i class="fas fa-pause-circle"></i>' : '<i class="fas fa-play-circle"></i>';
    }

    function renderPlaylist() {
        trackContainer.innerHTML = '';
        if (!masterPlaylist.length) {
            emptyMsg.style.display = 'block';
            return;
        }
        emptyMsg.style.display = 'none';
        let displayList = masterPlaylist; // bisa filter berdasarkan playlist nanti
        displayList.forEach((song, idx) => {
            const isLiked = likedSongs.includes(song.id);
            const row = document.createElement('div');
            row.className = `track-row ${currentSongIndex === idx ? 'active' : ''}`;
            row.innerHTML = `
                <div class="track-info">
                    <div class="track-icon"><i class="fas fa-music"></i></div>
                    <div>
                        <div class="track-title">${escapeHtml(song.title)}</div>
                        <div class="track-artist">${escapeHtml(song.artist)}</div>
                    </div>
                </div>
                <div class="track-actions">
                    <button class="like-track" data-id="${song.id}"><i class="fas ${isLiked ? 'fa-heart' : 'fa-heart'} heart-icon" style="color:${isLiked ? '#1DB954' : '#b3b3b3'}"></i></button>
                    ${currentUser && currentUser.role === 'admin' ? `<button class="edit-track" data-idx="${idx}"><i class="fas fa-pencil-alt"></i></button><button class="delete-track" data-idx="${idx}"><i class="fas fa-trash-alt"></i></button>` : ''}
                </div>
            `;
            row.querySelector('.track-info').addEventListener('click', () => {
                currentSongIndex = idx;
                loadSong(currentSongIndex);
                playCurrent();
            });
            const likeBtn = row.querySelector('.like-track');
            if (likeBtn) {
                likeBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (likedSongs.includes(song.id)) {
                        likedSongs = likedSongs.filter(id => id !== song.id);
                    } else {
                        likedSongs.push(song.id);
                    }
                    saveLiked();
                    renderPlaylist(); // refresh icon
                });
            }
            if (currentUser && currentUser.role === 'admin') {
                const editBtn = row.querySelector('.edit-track');
                const delBtn = row.querySelector('.delete-track');
                editBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const newTitle = prompt("Edit judul", song.title);
                    const newArtist = prompt("Edit artis", song.artist);
                    const newUrl = prompt("Edit URL MP3", song.url);
                    if (newTitle && newTitle.trim()) song.title = newTitle.trim();
                    if (newArtist && newArtist.trim()) song.artist = newArtist.trim();
                    if (newUrl && newUrl.trim() && newUrl.match(/\.mp3$/i)) song.url = newUrl.trim();
                    saveMasterPlaylist();
                    if (currentSongIndex === idx) {
                        nowPlayingTitle.innerText = song.title;
                        nowPlayingArtist.innerText = song.artist;
                        audio.src = song.url;
                        audio.load();
                        if (isPlaying) audio.play();
                    }
                    renderPlaylist();
                });
                delBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (confirm(`Hapus "${song.title}"?`)) {
                        masterPlaylist.splice(idx, 1);
                        if (masterPlaylist.length === 0) {
                            audio.pause();
                            isPlaying = false;
                            nowPlayingTitle.innerText = "Tidak ada lagu";
                            miniVinyl.classList.remove('vinyl-spin');
                            currentSongIndex = -1;
                        } else {
                            if (currentSongIndex >= idx) currentSongIndex = Math.max(0, currentSongIndex-1);
                            if (currentSongIndex >= masterPlaylist.length) currentSongIndex = masterPlaylist.length-1;
                            if (currentSongIndex !== -1) loadSong(currentSongIndex);
                        }
                        saveMasterPlaylist();
                        renderPlaylist();
                    }
                });
            }
            trackContainer.appendChild(row);
        });
    }

    function addSong() {
        let url = adminUrl.value.trim();
        let title = adminTitle.value.trim();
        let artist = adminArtist.value.trim();
        if (!url) { adminMsg.innerText = "Link MP3 wajib"; return; }
        if (!url.match(/\.mp3$/i)) { adminMsg.innerText = "URL harus .mp3"; return; }
        if (!title) title = "Lagu Baru";
        if (!artist) artist = "Unknown";
        const newId = Date.now();
        masterPlaylist.push({ id: newId, url, title, artist });
        saveMasterPlaylist();
        if (masterPlaylist.length === 1 && !audio.src) {
            currentSongIndex = 0;
            loadSong(0);
        }
        renderPlaylist();
        adminUrl.value = '';
        adminTitle.value = '';
        adminArtist.value = '';
        adminMsg.innerText = "Lagu berhasil ditambahkan!";
        setTimeout(() => adminMsg.innerText = '', 2000);
    }

    function escapeHtml(str) { return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
    function formatTime(sec) { if (isNaN(sec)) return "0:00"; let m = Math.floor(sec/60); let s = Math.floor(sec%60); return `${m}:${s<10?'0':''}${s}`; }

    // Audio events
    audio.addEventListener('timeupdate', () => {
        if (audio.duration && !isNaN(audio.duration)) {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = percent + '%';
            currentTimeSpan.innerText = formatTime(audio.currentTime);
            durationSpan.innerText = formatTime(audio.duration);
        }
    });
    audio.addEventListener('ended', () => {
        if (repeatMode) {
            loadSong(currentSongIndex);
            playCurrent();
        } else {
            nextTrack();
        }
    });
    progressBar.addEventListener('click', (e) => {
        const rect = progressBar.getBoundingClientRect();
        const perc = (e.clientX - rect.left) / rect.width;
        if (audio.duration) audio.currentTime = perc * audio.duration;
    });

    // Auth functions
    function initDefaultAdmin() {
        if (!users.find(u => u.email === 'admin@harmony.com')) {
            users.push({ email: 'admin@harmony.com', password: 'admin123', role: 'admin' });
            saveUsers();
        }
        if (masterPlaylist.length === 0) {
            masterPlaylist.push({ id: 1, url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3', title: 'Blinding Lights', artist: 'The Weeknd' });
            masterPlaylist.push({ id: 2, url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3', title: 'Levitating', artist: 'Dua Lipa' });
            saveMasterPlaylist();
        }
    }

    function showAuth(showLogin) {
        loginPanel.style.display = showLogin ? 'block' : 'none';
        registerPanel.style.display = showLogin ? 'none' : 'block';
        loginErr.innerText = '';
        regErr.innerText = '';
    }

    function register() {
        const email = regEmail.value.trim();
        const pwd = regPassword.value;
        const confirm = regConfirm.value;
        if (!email || !pwd) { regErr.innerText = "Email & password wajib"; return; }
        if (pwd !== confirm) { regErr.innerText = "Password tidak cocok"; return; }
        if (users.find(u => u.email === email)) { regErr.innerText = "Email sudah terdaftar"; return; }
        users.push({ email, password: pwd, role: 'user' });
        saveUsers();
        regErr.innerText = "Pendaftaran berhasil! Silakan login.";
        setTimeout(() => showAuth(true), 1500);
        regEmail.value = ''; regPassword.value = ''; regConfirm.value = '';
    }

    function login() {
        const email = loginEmail.value.trim();
        const pwd = loginPassword.value;
        const user = users.find(u => u.email === email && u.password === pwd);
        if (!user) { loginErr.innerText = "Email atau password salah"; return; }
        currentUser = user;
        authOverlay.style.display = 'none';
        mainApp.classList.add('active');
        greetingUserSpan.innerText = email.split('@')[0];
        userEmailBadge.innerText = email;
        userRoleBadge.innerText = user.role === 'admin' ? 'Admin' : 'Pengguna';
        if (user.role === 'admin') {
            adminPanelDiv.classList.add('show');
        } else {
            adminPanelDiv.classList.remove('show');
        }
        if (masterPlaylist.length > 0 && currentSongIndex !== -1) loadSong(currentSongIndex);
        renderPlaylist();
    }

    function logout() {
        currentUser = null;
        audio.pause();
        isPlaying = false;
        mainApp.classList.remove('active');
        authOverlay.style.display = 'flex';
        loginEmail.value = '';
        loginPassword.value = '';
        showAuth(true);
    }

    // Event binding
    loginBtn.onclick = login;
    registerBtn.onclick = register;
    showRegBtn.onclick = () => showAuth(false);
    showLoginBtn.onclick = () => showAuth(true);
    logoutBtnMain.onclick = logout;
    addSongAdminBtn.onclick = addSong;
    playPauseBtn.onclick = () => { if (masterPlaylist.length) isPlaying ? pauseCurrent() : playCurrent(); };
    prevBtn.onclick = prevTrack;
    nextBtn.onclick = nextTrack;
    shuffleCtrl.onclick = () => { shuffleMode = !shuffleMode; buildQueue(); shuffleCtrl.style.color = shuffleMode ? '#1DB954' : 'white'; };
    repeatCtrl.onclick = () => { repeatMode = !repeatMode; repeatCtrl.style.color = repeatMode ? '#1DB954' : 'white'; };
    speedSelect.onchange = () => audio.playbackRate = parseFloat(speedSelect.value);
    // Add mini vinyl spin class
    const style = document.createElement('style');
    style.textContent = `.vinyl-spin { animation: spin 4s linear infinite; } @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }`;
    document.head.appendChild(style);

    initDefaultAdmin();
    showAuth(true);
</script>
</body>
</html>
